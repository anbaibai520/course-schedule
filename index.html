<script>
/* ============ 应用内更新 · 启动引导 ============
   作用：打包成 App 后，内置网页是死的；这里在启动时检查是否已下载好新版，
   有则整体替换文档，实现"不重装 APK 也能升级"。
   ① 仅在 App 内启用（网页版本身即最新，不参与）；
   ② window.__hotLoaded 防止替换后的文档再次触发，避免死循环；
   ③ pending/ok 版本比对实现崩溃自动回滚到内置版本；
      否则浏览器会把原文档剩余内容继续解析进来，造成新旧内容叠加；
      等待期间先用样式隐藏，避免旧界面闪一下。 */
(function(){
  try{
    if (window.__hotLoaded) return;
    var isApp = !!window.Capacitor || location.protocol === 'file:' ||
                location.protocol === 'capacitor:' || location.hostname === 'localhost';
    if (!isApp) return;
    var html = localStorage.getItem('course-app-hot-html');
    if (!html || html.length < 20000) return;
    var info = {};
    try { info = JSON.parse(localStorage.getItem('course-app-upd') || '{}'); } catch(e){}
    var ok   = localStorage.getItem('course-app-ok') || '';
    var pend = localStorage.getItem('course-app-pending') || '';
    /* 已知有缺陷的版本：用户已下载但会被引导脚本写坏。命中后直接丢弃缓存回退内置版。
       v.7: 引导脚本 'replace' 注入看门狗时，反斜杠转义后 document.write 输出真实
       结束标签，导致 HTML 解析器提前闭合 script 块，body 出现裸 JS 文本。 */
    var BROKEN_VERSIONS = { '2026.09.09.7': 1 };
    if (info.version && BROKEN_VERSIONS[info.version]) {
      localStorage.removeItem('course-app-hot-html');
      localStorage.removeItem('course-app-upd');
      localStorage.removeItem('course-app-pending');
      return;
    }
    if (pend && pend !== ok){
      /* 上次新版未能完成启动：丢弃缓存，强制回退到内置版并硬刷新，避免卡在坏版本 */
      localStorage.removeItem('course-app-hot-html');
      localStorage.removeItem('course-app-upd');
      localStorage.removeItem('course-app-pending');
      document.write('<style id="hot-hide">html,body{visibility:hidden !important}</style>');
      setTimeout(function(){ try { location.reload(); } catch(e){} }, 600);
      return;
    }
    if (info.version && info.version !== ok) localStorage.setItem('course-app-pending', info.version);
    /* 关键：本页（内置版）接下来会被整份替换掉，它自己的启动工作全是白做的。
       这里打标记，让内置版主脚本跳过渲染/网络/定时器，只留下解析成本——
       这也是"打开要等两遍"的主要来源（旧实现把整份启动干了两遍，还留下指向已销毁
       DOM 的定时器与重复请求）。 */
    window.__hotSwapPending = 1;
    /* 只藏主界面，不藏 html/body：内置版既然已经不渲染了，就没有"旧界面闪一下"的问题，
       而加载图（#splash，fixed 铺满）可以在这一瞬先画出来，省掉一段纯白/纯黑等待。
       老版本内置页（还没跳过启动的）依然会被 .app 规则挡住，不会闪出旧课表。 */
    document.write('<style id="hot-hide">.app{visibility:hidden !important}</style>');
    var doReplace = function(){
      if (window.__hotLoaded) return;
      window.__hotLoaded = 1;
      /* 自愈看门狗：新文档若没在 8s 内完成首屏（主脚本 render 之后会置 window.__bootOk），
         说明替换后的页面脚本异常，立即丢弃并回退到内置版本。
         判据放在 window 而不是 DOM：document.open() 会清空 DOM，但 window 存活，
         所以用 DOM 标记做判据在被替换的文档里天然不成立——旧版 8 秒无条件整页重载
         就是这么来的（等于每次带更新的启动都多跑一遍启动流程）。
         __bootOk 在首屏渲染完成时即写入（早于任何网络请求），8s 已是数倍余量。
         guard 脚本还负责把 __hotSwapPending 归零：新文档必须正常运行，不能继承
         "跳过启动"的标记（window 在整文档替换时是复用的）。
         v.7 坑：document.write 输出字面结束标签会让 HTML 解析器提前闭合 script 块，
         后续所有 ' + ' 字面量直接成为 body 文本。正确做法：拼接字符串，不让源代码里
         出现结束标签完整序列。 */
      var guardScript = '<script>window.__hotSwapPending=0;setTimeout(function(){' +
        'if(!window.__bootOk){' +
        'try{localStorage.removeItem("course-app-hot-html");' +
        'localStorage.removeItem("course-app-upd");' +
        'localStorage.removeItem("course-app-pending");}catch(e){}' +
        'location.replace(location.href);' +
        '}},8000);<' + '/script>';
      try {
        document.open();
        document.write(guardScript);   /* 先 write 看门狗（新文档 head 首段） */
        document.write(html);          /* 再 write 主文档（head 解析完毕后自然衔接 body） */
        document.close();
      } catch (e) {
        try { var s = document.getElementById('hot-hide'); if (s) s.parentNode.removeChild(s); } catch (e2) {}
      }
    };
    if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', doReplace);
    else doReplace();
  }catch(e){}
})();
</script>

<title>我的课程表</title>
<style>
/* ============ 主题变量（可通过设置面板 / API 修改） ============ */
:root{
  --accent:#4f7cff;
  --gutter:58px;
  --radius:14px;
  --font:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
}
html[data-theme="light"]{
  --bg:#f2f4f9; --panel:#ffffff; --panel2:#f7f8fc; --text:#171a22;
  --muted:#767d8c; --line:#e5e8f0; --line2:#eef0f6; --shadow:0 6px 24px rgba(20,28,60,.10);
  --weekend:#f6f7fb; --now:#ef4444;
}
html[data-theme="dark"]{
  --bg:#0f1116; --panel:#181b22; --panel2:#1f232c; --text:#e9ecf3;
  --muted:#98a0b0; --line:#272c37; --line2:#21252e; --shadow:0 6px 24px rgba(0,0,0,.45);
  --weekend:#161920; --now:#ff5a5a;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;height:100%;overflow-x:hidden}
input,select,textarea{font-size:16px}   /* 防止 iOS 聚焦时自动缩放页面 */
body{
  background:var(--bg); color:var(--text); font-family:var(--font);
  font-size:14px; line-height:1.5; overscroll-behavior:none;
}
button,input,select{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:var(--line);border-radius:10px;border:3px solid var(--bg)}
::-webkit-scrollbar-track{background:transparent}

.app{display:flex;flex-direction:column;height:100%;max-width:1400px;margin:0 auto;background:var(--bg)}

/* ============ 顶部栏（视图带 A · 单行横滑） ============ */
.topbar{
  display:flex;align-items:center;gap:8px;padding:6px 10px;
  background:var(--panel);border-bottom:1px solid var(--line);
  position:sticky;top:0;z-index:30;
  flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;overscroll-behavior-x:contain;
  scroll-snap-type:x proximity;
  -webkit-overflow-scrolling:touch;
}
.topbar::-webkit-scrollbar{display:none}
.topbar > *{flex:0 0 auto}
.logo{display:flex;align-items:center;gap:9px;font-size:17px;font-weight:700;letter-spacing:.3px;white-space:nowrap}
.logo .dot{width:11px;height:11px;border-radius:4px;background:var(--accent);box-shadow:0 0 0 4px color-mix(in srgb,var(--accent) 20%,transparent)}
.spacer{flex:1}
.btn{
  display:inline-flex;align-items:center;gap:6px;padding:8px 13px;border-radius:10px;
  background:var(--panel2);border:1px solid var(--line);color:var(--text);
  font-size:13px;font-weight:500;white-space:nowrap;transition:.16s;
}
.btn:hover{border-color:color-mix(in srgb,var(--accent) 55%,var(--line));color:var(--accent)}
.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{filter:brightness(1.08);color:#fff}
.btn.danger{color:#e5484d;border-color:color-mix(in srgb,#e5484d 40%,var(--line))}
.btn.danger:hover{background:color-mix(in srgb,#e5484d 12%,transparent);color:#e5484d}
.btn.icon{padding:8px;width:36px;justify-content:center}
/* 周数下拉（仅日视图显示，位于功能带"新增课程"旁）：紧凑、样式与 .btn 协调 */
.week-sel{
  display:inline-flex;align-items:center;gap:4px;position:relative;
  background:var(--panel2);border:1px solid var(--line);border-radius:10px;
  padding:0 6px 0 8px;height:36px;font-size:12.5px;color:var(--text);flex:0 0 auto;
}
.week-sel select{
  appearance:none;-webkit-appearance:none;background:transparent;border:0;outline:0;
  color:var(--text);font-size:12.5px;font-weight:600;cursor:pointer;padding:4px 0;
  font-variant-numeric:tabular-nums;max-width:92px;text-overflow:ellipsis;
}
.week-sel .ws-ic{font-size:12px;color:var(--muted);pointer-events:none}
.week-sel .ws-caret{font-size:9px;color:var(--muted);pointer-events:none}
/* 日视图"选星期几"下拉（替代原滑动 chips，仅日视图显示，位于顶栏视图带） */
.day-sel{
  display:inline-flex;align-items:center;gap:4px;position:relative;
  background:var(--panel2);border:1px solid var(--line);border-radius:10px;
  padding:0 6px;height:36px;font-size:12.5px;color:var(--text);flex:0 0 auto;
}
.day-sel select{
  appearance:none;-webkit-appearance:none;background:transparent;border:0;outline:0;
  color:var(--text);font-size:12.5px;font-weight:600;cursor:pointer;padding:4px 0;
  font-variant-numeric:tabular-nums;
}
.day-sel .ds-caret{font-size:9px;color:var(--muted);pointer-events:none}
.seg{display:flex;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:3px;gap:2px}
.seg button{padding:6px 14px;border-radius:8px;font-size:13px;color:var(--muted);font-weight:600}
.seg button[aria-pressed="true"]{background:var(--accent);color:#fff}

/* ============ 工具条（功能带 B · 单行横滑） ============ */
.toolbar{
  display:flex;align-items:center;gap:8px;flex-wrap:nowrap;padding:6px 10px;
  background:var(--panel);border-bottom:1px solid var(--line);
  position:sticky;top:var(--topbar-h,50px);z-index:25;
  overflow-x:auto;scrollbar-width:none;overscroll-behavior-x:contain;
  scroll-snap-type:x proximity;-webkit-overflow-scrolling:touch;
}
.toolbar::-webkit-scrollbar{display:none}
.toolbar > *{flex:0 0 auto}
.chips{display:flex;gap:6px;flex-wrap:nowrap;padding-bottom:1px}
.chips::-webkit-scrollbar{display:none}
.chip{
  padding:6px 13px;border-radius:999px;background:var(--panel2);border:1px solid var(--line);
  font-size:13px;color:var(--muted);white-space:nowrap;transition:.15s;
}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
/* meta 右端吸住：横滑时让统计常驻右侧 */
.meta{font-size:12.5px;color:var(--muted);margin-left:auto;white-space:nowrap;
  position:sticky;right:0;background:var(--panel);padding-left:10px;
  background:linear-gradient(to right,transparent,var(--panel) 8px)}

/* ============ 周次条：显示当前周 + 可预览其它周 ============ */
.weekbar{display:none;align-items:center;gap:2px;font-size:12.5px;color:var(--text);white-space:nowrap;
  padding:2px 3px;border:1px solid var(--line);border-radius:9px;background:var(--panel2)}
.weekbar.on{display:inline-flex}
.weekbar .wb{background:none;border:0;cursor:pointer;font-size:13px;color:var(--muted);padding:2px 6px;border-radius:6px;line-height:1}
.weekbar .wb:hover{background:color-mix(in srgb,var(--accent) 12%,transparent);color:var(--text)}
.weekbar .wbl{display:inline-flex;align-items:baseline;gap:4px;padding:0 4px;min-width:0}
.weekbar .wbl b{font-variant-numeric:tabular-nums;font-size:13px}
.weekbar .wbl em{font-style:normal;font-size:11px;color:var(--muted)}
.weekbar .wbh{background:var(--accent);color:#fff;border:0;cursor:pointer;font-size:11px;padding:2px 7px;border-radius:999px;font-weight:600}
.weekbar .wbh:hover{opacity:.9}
.weekbar .wb-off{display:flex;align-items:center;gap:6px;padding:2px 6px;font-size:12px;color:var(--muted)}
.weekbar .wbset{background:none;border:0;color:var(--accent);cursor:pointer;font-size:11px;text-decoration:underline dotted;padding:0 2px}

/* ============ 天气胶囊 ============ */
.weather{
  display:inline-flex;align-items:center;gap:8px;padding:6px 11px;border-radius:11px;
  background:var(--panel2);border:1px solid var(--line);cursor:pointer;white-space:nowrap;
  transition:.16s;max-width:230px;flex-shrink:0;
}
.weather:hover{border-color:color-mix(in srgb,var(--accent) 55%,var(--line))}
.weather:active{transform:translateY(1px)}
.weather .wcity{display:flex;align-items:center;gap:3px;font-size:12px;font-weight:600;color:var(--muted);max-width:64px;overflow:hidden;text-overflow:ellipsis}
.weather .wcity svg{flex-shrink:0}
.weather .wmain{display:flex;align-items:center;gap:7px;min-width:0}
.weather .wmain .wic{font-size:19px;line-height:1}
.weather .wdeg{font-size:15px;font-weight:700;letter-spacing:.3px}
.weather .wdesc{font-size:12px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.weather .wtemp{font-size:11.5px;color:var(--muted)}
.weather.loading,.weather.error{opacity:.75;pointer-events:none}
.weather .wrefresh{font-size:11px;color:var(--muted);opacity:0;transition:.15s}
.weather:hover .wrefresh{opacity:.7}
@media(max-width:920px){ .weather .wdesc,.weather .wtemp{display:none} .weather{max-width:none} .weather .wcity{max-width:56px} }

/* ============ 天气弹窗（城市选择/详情） ============ */
.wbox{display:flex;flex-direction:column;gap:14px}
.w-city-now{display:flex;align-items:center;gap:12px;padding:14px 16px;border-radius:14px;
  background:linear-gradient(135deg,var(--panel2),color-mix(in srgb,var(--accent) 14%,var(--panel2)));border:1px solid var(--line)}
.w-city-now .big{font-size:42px;line-height:1}
.w-city-now .info{flex:1;min-width:0}
.w-city-now .info .nm{font-size:15px;font-weight:700}
.w-city-now .info .cd{font-size:12.5px;color:var(--muted);margin-top:1px}
.w-conds{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.w-conds .c{background:var(--panel2);border:1px solid var(--line);border-radius:11px;padding:9px 8px;text-align:center}
.w-conds .c .k{font-size:11px;color:var(--muted)}
.w-conds .c .v{font-size:14px;font-weight:700;margin-top:3px}
.w-manual{display:flex;gap:8px}
.w-manual .inp{flex:1}
.w-tip{font-size:11.5px;color:var(--muted);line-height:1.5}
.w-geo-btn{display:inline-flex;align-items:center;gap:5px;font-size:12.5px;color:var(--accent);cursor:pointer;background:none;border:0;padding:4px 0}
.w-geo-btn:hover{text-decoration:underline}
.w-loc-row{display:flex;align-items:center;justify-content:space-between;gap:10px}
/* 城市候选列表（解决同名地点误判，如「长春」既有吉林省会也有黑龙江的镇） */
.wcity-list{display:flex;flex-direction:column;gap:6px;margin-top:10px;max-height:230px;overflow:auto}
.wcity-opt{display:flex;align-items:center;gap:8px;padding:9px 11px;border:1px solid var(--line);
  border-radius:10px;background:var(--panel2);cursor:pointer;transition:.15s}
.wcity-opt:hover{border-color:color-mix(in srgb,var(--accent) 55%,var(--line))}
.wcity-opt.rec{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 8%,var(--panel2))}
.wcity-opt b{font-size:13.5px;font-weight:600;flex:0 0 auto}
.wcity-opt span{font-size:12px;color:var(--muted);flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wcity-opt em{flex:0 0 auto;font-size:10.5px;font-style:normal;color:var(--accent);
  border:1px solid color-mix(in srgb,var(--accent) 40%,transparent);border-radius:5px;padding:1px 5px}
.wcity-empty{font-size:12.5px;color:var(--muted);margin-top:10px;line-height:1.5}

/* ============ 多人叠加对比 ============ */
.cmp-layer{position:fixed;inset:0;z-index:120;display:flex;align-items:center;justify-content:center;padding:14px;--ok:#2fb37a;--acc:var(--accent)}
.cmp-layer[hidden]{display:none}
.cmp-bg{position:absolute;inset:0;background:rgba(10,14,25,.55);backdrop-filter:blur(3px);animation:fade .18s}
.cmp-card{
  position:relative;background:var(--panel);border:1px solid var(--line);border-radius:16px;
  box-shadow:0 20px 60px rgba(0,0,0,.4);width:min(1180px,100%);max-height:92vh;height:92vh;
  display:flex;flex-direction:column;animation:pop .2s cubic-bezier(.2,.9,.3,1.2);overflow:hidden;
}
.cmp-head{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.cmp-head .ttl{font-weight:700;font-size:15px;display:flex;align-items:center;gap:8px}
.cmp-head .sub{font-size:12px;color:var(--muted)}
.cmp-head .x{margin-left:auto;font-size:20px;line-height:1;color:var(--muted);padding:2px 8px;border-radius:8px;cursor:pointer}
.cmp-head .x:hover{background:var(--panel2);color:var(--text)}
.cmp-tabs{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:9px 16px;border-bottom:1px solid var(--line);background:var(--panel)}
.cmp-tabs .seg{flex:none}
.mxday-wrap{display:flex;align-items:center;gap:7px;flex:1;min-width:0}
.mxday-wrap .lbl{font-size:11.5px;color:var(--muted);font-weight:600;flex:none}
.cmp-tabs[data-m="grid"] .mxday-wrap{display:none}
.mxday-wrap .chips{flex:1}
/* —— 矩阵速查表 —— */
.mx-sticky{position:sticky;top:0;z-index:3;background:var(--panel2)}
.mx-tbl{width:100%;border-collapse:separate;border-spacing:0;table-layout:fixed}
.mx-tbl th,.mx-tbl td{border-bottom:1px solid var(--line2);border-right:1px solid var(--line2);padding:0;vertical-align:top}
.mx-tbl th:last-child,.mx-tbl td:last-child{border-right:0}
.mx-tbl th{position:sticky;top:0;background:var(--panel2);z-index:2;text-align:center;font-size:11px;color:var(--muted);font-weight:600;padding:6px 3px}
.mx-tbl th.mx-corner{position:sticky;left:0;z-index:4;min-width:74px;text-align:left;padding-left:10px;background:var(--panel2)}
.mx-tbl td.mx-corner{position:sticky;left:0;z-index:2;background:var(--panel);min-width:74px}
.mx-row td{background:var(--panel)}
.mx-row td.mx-corner{display:flex;align-items:center;gap:7px;font-size:12px;font-weight:700;padding:6px 10px;white-space:nowrap}
.mx-row td.mx-corner .sw{width:12px;height:12px;border-radius:50%;flex:none;border:1.5px solid rgba(255,255,255,.3);box-shadow:0 0 0 1.5px rgba(0,0,0,.22)}
.mx-cell{height:34px;padding:2px;overflow:hidden;display:flex;flex-direction:row;align-items:stretch;gap:2px}
.mx-cell .b{flex:1 1 0;min-width:0;height:100%;border-radius:6px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;cursor:default;overflow:hidden}
.mx-cell .b .ct{font-size:10.5px;font-weight:700;line-height:1.1;padding:0 3px;width:100%;text-align:center;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mx-cell .b .cl{font-size:8.5px;opacity:.85;line-height:1;width:100%;text-align:center;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mx-cell .b.free{background:color-mix(in srgb,var(--ok) 10%,transparent);border:1px dashed color-mix(in srgb,var(--ok) 40%,transparent)}
.mx-cell .b.free .ct{color:var(--ok);font-weight:500;font-size:10px}
.mx-cell:has(.b.overlap){padding:1px}
.mx-now{box-shadow:inset 0 0 0 1px var(--now)}
.mx-cap{font-size:11px;color:var(--muted);margin:8px 2px 4px;font-weight:600}
.cmp-body:not([data-m="matrix"]) .mx-wrap{display:none}
.cmp-body[data-m="grid"] .mx-wrap{display:none}
.cmp-cs{display:flex;gap:7px;flex-wrap:wrap;padding:10px 16px;border-bottom:1px solid var(--line);align-items:center;background:var(--panel)}
.cmp-cs .lbl{font-size:12px;color:var(--muted);font-weight:600;margin-right:2px}
.cch{display:inline-flex;align-items:center;gap:7px;padding:5px 12px 5px 6px;border-radius:999px;cursor:pointer;user-select:none;
  font-size:12.5px;border:2px solid var(--line);transition:.15s;background:var(--panel2)}
.cch .sw{width:14px;height:14px;border-radius:50%;flex:none;border:1.5px solid rgba(255,255,255,.28);box-shadow:0 0 0 1.5px rgba(0,0,0,.25)}
.cch .cnt{color:var(--muted);font-size:11px;margin-left:1px}
.cch.on{border-color:var(--acc);background:color-mix(in srgb,var(--acc) 24%,var(--panel2));box-shadow:0 0 0 1px color-mix(in srgb,var(--acc) 40%,transparent)}
.cch.off{opacity:.45;text-decoration:line-through}
.cch.all{font-weight:600;border-style:dashed}
.cmp-body{flex:1;overflow:auto;padding:14px 16px;-webkit-overflow-scrolling:touch}
.cmp-stats{display:flex;gap:14px;flex-wrap:wrap;margin-bottom:14px}
.cstat{flex:1;min-width:150px;background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.cstat .nm{font-size:13px;font-weight:700;display:flex;align-items:center;gap:7px}
.cstat .nm .sw{width:12px;height:12px;border-radius:50%;flex:none;border:1.5px solid rgba(255,255,255,.28);box-shadow:0 0 0 1.5px rgba(0,0,0,.25)}
.cstat .bar{height:8px;background:var(--line);border-radius:6px;overflow:hidden;margin-top:8px;position:relative}
.cstat .bar > i{display:block;height:100%;background:var(--acc);border-radius:6px}
.cstat .meta{font-size:11px;color:var(--muted);margin-top:5px;display:flex;justify-content:space-between}
.cmp-hint{font-size:12px;color:var(--muted);margin:2px 0 10px;line-height:1.6}
.cmp-hint b{color:var(--ok);font-weight:700}
.cmp-grid{display:flex;gap:10px;padding-bottom:6px}
.cgcol{flex:1;min-width:96px;background:var(--panel2);border:1px solid var(--line);border-radius:12px;overflow:hidden;display:flex;flex-direction:column}
.cgcol .hd{text-align:center;font-weight:700;font-size:13px;padding:8px 4px;border-bottom:1px solid var(--line);position:relative}
.cgcol .hd small{display:block;font-weight:500;font-size:10.5px;color:var(--muted)}
.cgcol .hd.today{color:var(--accent)}
.cgcol .body{position:relative;height:520px;overflow:hidden;flex:0 0 520px}
.cgcol .body .zl{position:absolute;left:0;right:0;border-top:1px dashed var(--line2);pointer-events:none}
.cgcol .free{position:absolute;left:3px;right:3px;background:color-mix(in srgb,var(--ok) 13%,transparent);
  border:1px dashed color-mix(in srgb,var(--ok) 55%,transparent);border-radius:6px;overflow:hidden}
.cgcol .free .ft{font-size:10px;color:var(--ok);padding:2px 5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cgcol .blk{position:absolute;left:3px;right:3px;border-radius:6px;border:1px solid rgba(255,255,255,.16);
  box-shadow:0 1px 3px rgba(0,0,0,.16);cursor:pointer;overflow:hidden;transition:filter .12s,box-shadow .12s;display:flex;flex-direction:column;justify-content:center;gap:1px}
.cgcol .blk:hover{filter:brightness(1.08);box-shadow:0 3px 10px rgba(0,0,0,.22);z-index:5}
.cgcol .blk .bt{font-size:9.5px;opacity:.85;line-height:1;padding:0 5px}
.cgcol .blk .pn{font-size:10.5px;font-weight:700;line-height:1.15;padding:0 5px}
.cgcol .blk.multi .pn{padding:0 4px}
.cgcol .zall{position:absolute;left:3px;right:3px;text-align:center;color:var(--muted);font-size:11px;top:6px}
.cmp-foot{display:flex;align-items:center;gap:8px;padding:10px 16px;border-top:1px solid var(--line);flex-wrap:wrap;background:var(--panel2)}
.cmp-foot .tl{font-size:11.5px;color:var(--muted)}
.legend{display:inline-flex;align-items:center;gap:7px;margin-left:auto;flex-wrap:wrap}
.legend .lg{display:inline-flex;align-items:center;gap:4px;font-size:11px;color:var(--muted)}
.legend .sw{width:10px;height:10px;border-radius:3px;flex:none}


/* ============ 网格 ============ */
.scroll{flex:1;overflow:auto;-webkit-overflow-scrolling:touch;padding:12px 14px 40px}
.board{
  background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);
  overflow:hidden;box-shadow:var(--shadow);
}
.board-head{display:grid;grid-template-columns:var(--gutter) 1fr;background:var(--panel2);border-bottom:1px solid var(--line)}
.board-head .corner{
  display:flex;align-items:center;justify-content:center;font-size:11.5px;color:var(--muted);
  border-right:1px solid var(--line);height:46px;
}
.days{display:grid}
.days > div{
  display:flex;flex-direction:column;align-items:center;justify-content:center;height:46px;
  font-size:13.5px;font-weight:600;color:var(--muted);border-left:1px solid var(--line2);
}
.days > div:first-child{border-left:1px solid var(--line)}
.days > div.today{color:var(--accent)}
.days > div small{font-size:10.5px;font-weight:500;opacity:.7}

.board-body{display:grid;grid-template-columns:var(--gutter) 1fr;position:relative}
.gutter{position:relative;border-right:1px solid var(--line);background:var(--panel)}
.gutter .tick{
  position:absolute;right:8px;transform:translateY(-50%);font-size:11.5px;color:var(--muted);
  font-variant-numeric:tabular-nums;white-space:nowrap;
}
.canvas{
  position:relative;
  background-image:repeating-linear-gradient(to bottom,var(--line) 0 1px,transparent 1px var(--h,56px));
  background-position:0 0;
}
.col{position:absolute;top:0;bottom:0;border-left:1px solid var(--line2);cursor:copy}
.col:first-child{border-left:0}
.col.weekend{background:var(--weekend)}
.col:hover{background:color-mix(in srgb,var(--accent) 6%,transparent)}
.col.weekend:hover{background:color-mix(in srgb,var(--accent) 9%,var(--weekend))}

/* ============ 课程块 ============ */
/* 排版规则（2026-09-17 重做）
   手机上一列只有 ~70px，而课名常是 "PSP002TC-Lecture" 这类长串。
   旧版固定 13px 字号 + word-break:break-all，把单词拦腰截断成
   "C-Lectur / ure" 这种碎片；时间 "11:00 - 12:50" 还会折成两行，
   结果是几乎每个块的内容都溢出，关键信息被裁掉。
   现在：字号随列宽自适应（--fs 由 renderBoard 按列宽算好注入）、
        时间永远单行、课名只在空格/连字符处断行、行数（--lp）按块高夹紧，
        高度不足时优先牺牲「地点」「时间」，课名永远保留。 */
.blk{
  --fs:12.5px;
  position:absolute;overflow:hidden;border-radius:8px;padding:4px 4px;
  background:var(--c);color:var(--fg);box-shadow:0 1px 2px rgba(0,0,0,.16);
  cursor:pointer;touch-action:manipulation;user-select:none;
  border:1px solid rgba(255,255,255,.22);
  display:flex;flex-direction:column;justify-content:center;gap:2px;
  transition:box-shadow .15s,filter .15s;
  text-shadow:0 1px 1px rgba(0,0,0,.22);   /* 饱和底色上白字更实一点 */
}
.blk:hover{filter:brightness(1.06);box-shadow:0 4px 14px rgba(0,0,0,.22);z-index:5}
.blk:active{filter:brightness(.94)}
/* 时间：单行不折行，比课名小一档；放不下时由 renderBoard 整行不渲染 */
.blk .bt{font-size:calc(var(--fs) - 1.5px);opacity:.86;font-variant-numeric:tabular-nums;
  line-height:1.12;white-space:nowrap;overflow:hidden;letter-spacing:-.1px;flex:none}
/* 课名：占满剩余高度；断行只发生在空格/连字符处；超出 --lp 行即省略 */
.blk .bn{font-size:var(--fs);font-weight:700;line-height:1.22;min-height:0;
  overflow-wrap:break-word;word-break:normal;
  display:-webkit-box;-webkit-line-clamp:var(--lp,3);-webkit-box-orient:vertical;overflow:hidden}
/* 老师 · 地点：贴底单行省略 */
.blk .bm{font-size:calc(var(--fs) - 1.5px);opacity:.82;line-height:1.12;flex:none;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nowline{position:absolute;left:0;right:0;height:0;border-top:2px solid var(--now);z-index:15;pointer-events:none}
.nowline::before{
  content:"";position:absolute;left:-4px;top:-5px;width:8px;height:8px;border-radius:50%;background:var(--now);
}
.nowline span{
  position:absolute;right:4px;top:-9px;background:var(--now);color:#fff;font-size:10px;
  padding:1px 5px;border-radius:5px;font-variant-numeric:tabular-nums;
}

/* ============ 弹窗 ============ */
.modal{position:fixed;inset:0;z-index:100;display:flex;align-items:center;justify-content:center;padding:16px}
.modal[hidden]{display:none}
.modal-bg{position:absolute;inset:0;background:rgba(10,14,25,.5);backdrop-filter:blur(3px);animation:fade .18s}
.modal-card{
  position:relative;background:var(--panel);border:1px solid var(--line);border-radius:16px;
  box-shadow:0 20px 60px rgba(0,0,0,.35);width:100%;max-width:520px;max-height:88vh;
  display:flex;flex-direction:column;animation:pop .2s cubic-bezier(.2,.9,.3,1.2);
}
@keyframes fade{from{opacity:0}}
@keyframes pop{from{opacity:0;transform:translateY(14px) scale(.97)}}
.modal-card > header{
  display:flex;align-items:center;gap:10px;padding:15px 18px;border-bottom:1px solid var(--line);font-weight:700;font-size:15px;
}
.modal-card > header .x{margin-left:auto;font-size:20px;line-height:1;color:var(--muted);padding:2px 6px;border-radius:8px}
.modal-card > header .x:hover{background:var(--panel2);color:var(--text)}
.modal-body{padding:16px 18px;overflow:auto;flex:1}
.modal-foot{display:flex;gap:9px;padding:14px 18px;border-top:1px solid var(--line);flex-wrap:wrap}
.modal-foot .spacer{flex:1}

.field{margin-bottom:14px}
.field > label{display:block;font-size:12px;color:var(--muted);margin-bottom:6px;font-weight:600}
.inp{
  width:100%;padding:9px 11px;border-radius:10px;border:1px solid var(--line);
  background:var(--panel2);outline:none;transition:.15s;
}
.inp:focus{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 16%,transparent)}
.row{display:flex;gap:9px}
.row > *{flex:1;min-width:0}
.swatches{display:flex;flex-wrap:wrap;gap:8px}
.sw{width:32px;height:32px;border-radius:9px;border:2px solid transparent;transition:.15s;position:relative}
.sw[aria-pressed="true"]{border-color:var(--text);transform:scale(1.08)}
.sw[aria-pressed="true"]::after{content:"✓";position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#fff;font-size:15px;font-weight:800;text-shadow:0 1px 3px rgba(0,0,0,.5)}

.srow{position:relative;border:1px solid var(--line);border-radius:12px;padding:9px 10px;background:var(--panel2);margin-bottom:9px}
.srow-hd{display:flex;align-items:center;gap:8px;margin-bottom:7px}
.srow-hd .sday{flex:1;min-width:0;padding:6px 8px;border-radius:8px;border:1px solid var(--line);background:var(--panel);outline:none;font-size:13px}
.srow .del{flex:0 0 27px;height:27px;border-radius:8px;color:var(--muted);display:flex;align-items:center;justify-content:center;background:var(--panel);border:1px solid var(--line);cursor:pointer}
.srow .del:hover{color:#e5484d}
.srow-tm{display:flex;align-items:flex-start;gap:8px}
.srow-tm .to{color:var(--muted);font-weight:700;flex:none;height:96px;display:flex;align-items:center;font-size:15px}
.srow .loc{margin-top:7px;width:100%;box-sizing:border-box;padding:7px 9px;border-radius:9px;border:1px solid var(--line);background:var(--panel);outline:none;min-width:0;font-size:13px}
.srow .loc:focus{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 16%,transparent)}
/* 周次录入行 */
.srow-wk{display:flex;align-items:center;gap:7px;margin-top:7px;font-size:12.5px;flex-wrap:wrap}
.srow-wk .wk-lbl{color:var(--muted);font-weight:600;flex:none}
.srow-wk select{background:var(--panel);border:1px solid var(--line);border-radius:8px;color:var(--text);padding:5px 6px;font-size:12.5px;outline:none;max-width:118px}
.srow-wk .spgrp{display:inline-flex;align-items:center;gap:5px;color:var(--muted);flex-wrap:wrap}
.srow-wk .spgrp.off{display:none}
.srow-wk .spgrp input{width:52px;padding:5px 6px;border-radius:8px;border:1px solid var(--line);background:var(--panel2);outline:none;font-size:12.5px;text-align:center;color:var(--text)}
.srow-wk .spgrp input:focus{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 16%,transparent)}
.srow-wk .spgrp select{max-width:80px}
.tmc{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
.tmc .tcol{width:100%}
.tmc-cap{font-size:10px;color:var(--muted);text-align:center;font-weight:600;letter-spacing:.5px;line-height:12px;user-select:none}
.tcol{position:relative;overflow-y:auto;scroll-snap-type:y mandatory;scroll-snap-stop:normal;border:1px solid var(--line);border-radius:12px;background:var(--panel);overscroll-behavior:contain;scrollbar-width:none;cursor:ns-resize;touch-action:pan-y;height:96px}
.tcol::-webkit-scrollbar{display:none}
.tcol.dragging{scroll-snap-type:none;cursor:grabbing;scroll-behavior:auto}
.tcol.dragging *{cursor:grabbing}
/* 中间高亮胶囊：盖在当前格，选中的时间就在这条带子里 */
.tcol .cur{position:absolute;left:5px;right:5px;top:calc(50% - 16px);height:32px;border-radius:9px;background:linear-gradient(180deg,color-mix(in srgb,var(--accent) 22%,transparent),color-mix(in srgb,var(--accent) 8%,transparent));box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--accent) 48%,transparent);pointer-events:none;z-index:1}
/* 顶/底固定渐变罩：选项滚入罩下渐隐，营造“收进容器”的纵深感 */
.tcol::before,.tcol::after{content:"";position:absolute;left:1px;right:1px;height:20px;pointer-events:none;z-index:5}
.tcol::before{top:0;background:linear-gradient(180deg,var(--panel),transparent)}
.tcol::after{bottom:0;background:linear-gradient(0deg,var(--panel),transparent)}
.tcol .opts{padding:34px 0}
.tcol .opt{height:32px;line-height:32px;text-align:center;font-size:13.5px;color:var(--muted);font-variant-numeric:tabular-nums;scroll-snap-align:center;user-select:none;cursor:pointer;position:relative;z-index:0;transition:color .12s,font-size .12s;font-weight:400}
.tcol .opt.on{color:var(--accent);font-weight:700;font-size:16px;letter-spacing:.3px}
.shead{display:none}
.tm-hint{font-size:11px;color:var(--muted);margin:2px 0 4px;line-height:1.5}
.addlink{color:var(--accent);font-size:13px;font-weight:600;padding:6px 0}
.setrow{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--line2)}
.setrow:last-child{border-bottom:0}
.setrow .lb{flex:1;font-size:13.5px}
.setrow .lb small{display:block;color:var(--muted);font-size:11.5px;font-weight:400;margin-top:2px}
.setrow input[type=range]{width:130px;accent-color:var(--accent)}
.setrow input[type=number]{width:74px;padding:7px 9px;border-radius:9px;border:1px solid var(--line);background:var(--panel2);outline:none}
.setrow select{padding:7px 9px;border-radius:9px;border:1px solid var(--line);background:var(--panel2);outline:none}
.switch{width:44px;height:25px;border-radius:99px;background:var(--line);position:relative;transition:.2s;flex:0 0 auto}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:19px;height:19px;border-radius:50%;background:#fff;transition:.2s;box-shadow:0 1px 3px rgba(0,0,0,.3)}
.switch[aria-pressed="true"]{background:var(--accent)}
.switch[aria-pressed="true"]::after{left:22px}
.hint{font-size:12px;color:var(--muted);line-height:1.6}
/* ============ 应用更新（弹窗 / 进度 / 重启遮罩） ============ */
.btn[disabled]{opacity:.55;pointer-events:none}
.upd-tag{
  display:inline-block;padding:3px 9px;border-radius:99px;font-size:12px;
  background:var(--panel2);color:var(--muted);border:1px solid var(--line);
}
.upd-tag.new{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
.upd-link{color:var(--muted);text-decoration:underline;cursor:pointer}
.upd-link:hover{color:var(--text)}
#updMask{
  position:fixed;inset:0;z-index:9999;display:flex;align-items:center;justify-content:center;
  background:color-mix(in srgb,var(--bg) 90%,transparent);
}
.upd-card{
  display:flex;flex-direction:column;align-items:center;gap:10px;min-width:186px;
  padding:26px 30px;border-radius:var(--radius);background:var(--panel);
  box-shadow:var(--shadow);text-align:center;
}
.upd-card b{font-size:14px;color:var(--text)}
.upd-card small{font-size:12px;color:var(--muted)}
.upd-spin{
  width:30px;height:30px;border-radius:50%;border:3px solid var(--line);
  border-top-color:var(--accent);animation:updSpin .8s linear infinite;
}
@keyframes updSpin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){ .upd-spin{animation-duration:2.4s} }
/* ============ 日列表视图 ============ */
.dlist{display:flex;flex-direction:column}
.dgroup{border-bottom:1px solid var(--line)}
.dgroup:last-child{border-bottom:0}
.dhead{display:flex;align-items:center;gap:10px;padding:10px 14px;background:var(--panel2)}
.dgroup.today .dhead{background:color-mix(in srgb,var(--accent) 10%,var(--panel2))}
.dname{font-size:14px;font-weight:700;display:flex;align-items:center;gap:6px}
.dname i{font-style:normal;font-size:10.5px;font-weight:600;color:#fff;background:var(--accent);padding:1px 6px;border-radius:5px}
.dcount{font-size:12px;color:var(--muted)}
.dadd{
  margin-left:auto;font-size:12.5px;font-weight:600;color:var(--accent);
  padding:5px 11px;border-radius:8px;background:transparent;
  border:1px dashed color-mix(in srgb,var(--accent) 45%,var(--line));transition:.15s;
}
.dadd:hover{background:color-mix(in srgb,var(--accent) 11%,transparent)}
.ditem{display:flex;align-items:center;gap:11px;padding:10px 14px;border-top:1px solid var(--line2);cursor:pointer;transition:.15s}
.ditem:hover{background:var(--panel2)}
.dbar{width:4px;align-self:stretch;border-radius:3px;flex:0 0 4px;min-height:34px}
.dtime{flex:0 0 84px;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;line-height:1.35}
.dtime b{display:block;font-size:13.5px;color:var(--text);font-weight:700}
.dmain{flex:1;min-width:0}
.dtitle{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dsub{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px}
.dacts{display:flex;gap:6px;flex:0 0 auto}
.dacts button{font-size:12px;padding:5px 10px;border-radius:8px;border:1px solid var(--line);background:var(--panel2);color:var(--muted);transition:.15s}
.dacts .dedit:hover{color:var(--accent);border-color:color-mix(in srgb,var(--accent) 50%,var(--line))}
.dacts .ddel:hover{color:#e5484d;border-color:color-mix(in srgb,#e5484d 45%,var(--line))}
.dempty{padding:11px 14px;font-size:12.5px;color:var(--muted);opacity:.55;border-top:1px solid var(--line2)}

.emptyhint{
  position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:6px;color:var(--muted);font-size:14px;text-align:center;padding:20px;pointer-events:none;

const parseDay = d => { const t = new Date(String(d) + 'T00:00:00'); return isNaN(t) ? null : t; };
/* 当前学期开始周默认 = 本周周一（让"今天是第 1 周"起步，可在设置里改） */
const defaultTermStart = () => isoDay(mondayOf(new Date()));
/* 给定开学周一 + 今天，算今天是第几周（1 起）；早于开学返回 null(未开始) */
function weekOfToday(termStart){
  const m = parseDay(termStart); if (!m) return null;
  const today = new Date(); today.setHours(0, 0, 0, 0);
  const diff = Math.floor((today - m) / 86400000);          // 距开学周周一的天数
  if (diff < 0) return null;                                 // 还没开学
  return Math.floor(diff / 7) + 1;
}
/* 规范化 session.weeks → null 或 {f,t,p}（含周期 0每/1单/2双）
   注意：**字符串周次（"1-16" / "单周"）也必须能解析**——早先只读 w.f/w.t，
   遇到字符串会整体塌成"第 1 周"，等于把这门课其余周次静默吃掉（看着像"没导入"）。
   这里复用 impWeeks 的文本解析能力（同为 IIFE 内顶层函数声明，可安全调用）。 */
function normWeeks(w, total){
  const T = Math.max(1, +total || 20);
  if (w == null) return null;
  if (typeof w === 'string' || typeof w === 'number'){
    const s = String(w).trim();
    if (!s || /^(null|每周|全周|整学期|all)$/i.test(s)) return null;   // 空/每周 → 不限制
    return impWeeks(s, T);
  }
  if (typeof w !== 'object') return null;
  const f = Math.round(+w.f || w.from || 1);
  const t = Math.round(+w.t || w.to || f);
  const p = [0, 1, 2].includes(+w.p) ? +w.p : 0;
  return { f: clamp(f, 1, T), t: clamp(Math.max(f, t), 1, T), p };
}
/* 这个时间段是否在第 wk 周上课 */
function weeksHas(w, wk){
  if (!w) return true;                                        // null = 每周
  if (wk == null) return true;
  if (wk < w.f || wk > w.t) return false;
  if (w.p === 1 && (wk - w.f) % 2 !== 0) return false;        // 单周
  if (w.p === 2 && (wk - w.f) % 2 === 0) return false;        // 双周
  return true;
}
/* 人类可读标签，如：每周都上 / 第1周 / 第1-8周 · 单周 */
function weeksLabel(w){
  if (!w) return '每周';
  const p = w.p === 1 ? ' · 单周' : w.p === 2 ? ' · 双周' : '';
  return w.f === w.t ? `第${w.f}周${p}` : `第${w.f}-${w.t}周${p}`;

/* ------------------------- 事件总线（扩展点） ------------------------- */

   ------------------------------------------------------------ */
function activePerson(st){

function attachCourses(st){

    st.people = [p]; st.activeId = p.id;
  }
  if (!st.people.some(p => p.id === st.activeId)) st.activeId = st.people[0].id;
  Object.defineProperty(st, 'courses', {
    configurable: true, enumerable: false,
    get(){ const p = activePerson(st); return p ? p.courses : []; },
    set(v){ const p = activePerson(st); if (p) p.courses = v; }

}

let memFallback = null;

function load(){

  } catch (e) { console.warn('本地存储不可用，将使用内存模式', e); }
  return attachCourses(seed());
}
function normalize(o){
  const d = defaults();
  if (!o || typeof o !== 'object') return attachCourses(seed());
  const s = Object.assign(d.settings, o.settings || {});
  s.dayStart = clamp(+s.dayStart || 7, 0, 20);
  s.dayEnd   = clamp(+s.dayEnd   || 22, s.dayStart + 1, 24);
  s.hourHeight = clamp(+s.hourHeight || 56, 30, 160);
  s.snap = [1, 5, 10, 15, 30].includes(+s.snap) ? +s.snap : 5;
  s.totalWeeks = clamp(+s.totalWeeks || 20, 1, 30);
  s.termStart = /^\d{4}-\d{2}-\d{2}$/.test(String(s.termStart || '')) ? String(s.termStart)
                : (parseDay(s.termStart) ? isoDay(parseDay(s.termStart)) : d.settings.termStart);
  s.weekFilter = s.weekFilter !== false;
  s.autoPalette = s.autoPalette !== false;   // 默认开启：不同课自动用不同颜色
  /* 单份课表的课程清洗 + 排序（供各处复用）。
     末尾丢弃「没有任何时间段」的课程：这种课在界面上既显示不出、也点不开，
     纯粹是看不见的脏数据（旧版导入缺陷就会造出这种课），顺带自愈历史脏数据。 */
  const normCourses = list => (Array.isArray(list) ? list : []).map(c => ({
    id: c.id || uid(),
    name: String(c.name || '未命名课程'),
    teacher: String(c.teacher || ''),
    note: String(c.note || ''),
    color: /^#[0-9a-f]{6}$/i.test(c.color || '') ? c.color : autoColor(c.name),
    sessions: sortSessions((Array.isArray(c.sessions) ? c.sessions : []).map(x => ({
      id: x.id || uid(),
      day: clamp(+x.day || 1, 1, 7),
      start: clamp(+x.start || 480, 0, 1440),
      end: clamp(+x.end || 565, 0, 1440),
      location: String(x.location || ''),
      weeks: normWeeks(x.weeks, s.totalWeeks)
    })).filter(x => x.end > x.start))
  })).filter(c => c.sessions.length);

  let people = [];
  if (Array.isArray(o.people) && o.people.length) {
    people = o.people.map(p => ({
      id: p.id || uid(),
      name: String(p.name || '未命名课表').trim().slice(0, 20) || '未命名课表',
      courses: normCourses(p.courses)
    }));
  } else {
    /* 旧版 v1 结构（顶层 courses）：迁移为名为「我的课表」的一份 */
    people = [{ id: uid(), name: String(o.owner || '我的课表').trim().slice(0, 20) || '我的课表',
                courses: normCourses(o.courses) }];
  }
  const seen = new Set();
  people.forEach(p => { while (seen.has(p.id)) p.id = uid(); seen.add(p.id); });
  if (!people.length) people = defaults().people;

}
function save(){
  try { localStorage.setItem(LS_KEY, JSON.stringify(state)); }
  catch (e) { memFallback = state; console.warn('保存失败（可能无本地存储权限）', e); }

/* ------------------------- 本地上课提醒（仅原生安卓） -------------------------
   通过 @capacitor/local-notifications 在上课前 N 分钟弹出系统通知。
   网页 / PWA 端不启用（Capacitor.isNativePlatform() 为 false）。
   settings.reminderMin：0 = 关闭，否则为提前提醒的分钟数（默认 10）。 */
let _notifyTimer = null;
function isNativeApp(){ return !!(window.Capacitor && Capacitor.isNativePlatform && Capacitor.isNativePlatform()); }
function notifyPlugin(){ return (window.Capacitor && Capacitor.Plugins && Capacitor.Plugins.LocalNotifications) || null; }
function scheduleNotifySoon(){ if (_notifyTimer) clearTimeout(_notifyTimer); _notifyTimer = setTimeout(rescheduleNotifications, 1500); }
function notifyId(a, b, w){
  const str = (a || '') + '|' + (b || '') + '|' + w;
  let h = 2166136261;
  for (let i = 0; i < str.length; i++) { h ^= str.charCodeAt(i); h = Math.imul(h, 16777619); }
  return (h >>> 0) % 2000000000 + 1;
}
async function rescheduleNotifications(){
  if (!isNativeApp()) return;                       // 仅安卓 APK 启用
  const LN = notifyPlugin();
  if (!LN) return;                                  // 插件不可用 → 静默跳过
  const S = state.settings;
  if (!S.reminderMin || S.reminderMin <= 0) { try { await LN.cancelAll(); } catch (e) {} return; }
  // 权限
  let perm = null;
  try { perm = await LN.checkPermissions(); } catch (e) {}
  if (!perm || (perm.display !== 'granted' && perm.notifications !== 'granted')) {
    try { perm = await LN.requestPermissions(); } catch (e) {}
  }
  const granted = perm && (perm.display === 'granted' || perm.notifications === 'granted');
  if (!granted) return;                             // 用户未授权 → 跳过
  // 计算未来提醒
  const base = parseDay(S.termStart);
  if (!base) { try { await LN.cancelAll(); } catch (e) {} return; }
  const total = clamp(+S.totalWeeks || 20, 1, 30);
  const lead = +S.reminderMin;
  const curW = realWeek() || 1;
  const now = Date.now();
  const list = [];
  const courses = state.courses || [];
  let guard = 0; const MAX = 250;
  for (const c of courses) {
    if (!c || !Array.isArray(c.sessions)) continue;
    for (const s of c.sessions) {
      if (!s) continue;
      const d = +s.day, startMin = +s.start;
      for (let w = curW; w <= total; w++) {
        if (!weeksHas(s.weeks, w)) continue;
        const dt = new Date(base.getTime());
        dt.setDate(dt.getDate() + (w - 1) * 7 + (d - 1));
        dt.setHours(0, 0, 0, 0);
        dt.setMinutes(dt.getMinutes() + startMin - lead);
        if (dt.getTime() <= now) continue;         // 过期（含本周已过的）跳过
        if (++guard > MAX) break;
        list.push({
          id: notifyId(c.id, s.id, w),
          title: c.name || '课程提醒',
          body: DAY_NAMES[d] + ' ' + fmt(startMin) + ' 开始' + (s.location ? ' · ' + s.location : ''),
          schedule: { at: dt, allowWhileIdle: true, exact: true }
        });
      }
      if (guard > MAX) break;
    }
    if (guard > MAX) break;
  }
  try {
    await LN.cancelAll();
    if (list.length) await LN.schedule({ notifications: list });
  } catch (e) {
    // 精确闹钟权限不足（Android12+）时降级为不精确排程
    try {
      const list2 = list.map(n => { const c2 = Object.assign({}, n); c2.schedule = Object.assign({}, c2.schedule); delete c2.schedule.exact; return c2; });
      await LN.schedule({ notifications: list2 });
    } catch (e2) { console.warn('排程上课提醒失败', e2); }
  }
}

/* ------------------------- UI 状态 ------------------------- */
const ui = { view: 'week', day: todayDow(), viewWeek: null };   // viewWeek: null=跟随真实周，否则手动预览第几周

/* 当前真实是第几周（依据设置 termStart）；未开学返回 null */
function realWeek(){
  const S = state.settings;
  if (!S.weekFilter || !S.termStart) return null;
  const w = weekOfToday(S.termStart);
  if (w == null) return null;
  return clamp(w, 1, S.totalWeeks);
}
/* 实际用于过滤的周：weekFilter 关闭→null(全部)；否则手动预览或真实周 */
function viewWeek(){
  const S = state.settings;
  if (!S.weekFilter) return null;
  return ui.viewWeek != null ? clamp(ui.viewWeek, 1, S.totalWeeks) : realWeek();
}
/* 某份课表（可能来自云端同学）对应的"今天第几周" */
function personWeek(p){
  const S = state.settings;
  const ts = (p && p.termStart) || S.termStart;
  const tot = (p && p.totalWeeks) || S.totalWeeks;
  const wf  = p && p.weekFilter != null ? p.weekFilter : S.weekFilter;
  if (!wf || !ts) return null;
  const w = weekOfToday(ts); if (w == null) return null;
  return clamp(w, 1, tot);
}
/* 对比/汇总里：某人(可能含云端)的某时间段是否属于"其本周该上"的课 */
function personShown(p, s){
  const wk = personWeek(p);
  return wk == null || weeksHas(s.weeks, wk);
}
/* 该时间段是否应在"当前（手动或真实）周"显示 */
function sessionShown(s){
  const wk = viewWeek();
  return wk == null || weeksHas(s.weeks, wk);
}

function visibleDays(){
  const fd = clamp(+state.settings.firstDay || 1, 1, 7);
  let arr = []; for (let i = 0; i < 7; i++) arr.push(((fd - 1 + i) % 7) + 1);
  if (!state.settings.showWeekend) arr = arr.filter(d => d <= 5);
  return arr;
}
function currentDays(){ return ui.view === 'day' ? [ui.day] : visibleDays(); }

/* 列表视图：始终显示全部 7 天（不隐藏周末），避免已有课程被藏起来 */
function listDays(){
  const fd = clamp(+state.settings.firstDay || 1, 1, 7);
  const arr = []; for (let i = 0; i < 7; i++) arr.push(((fd - 1 + i) % 7) + 1);
  return arr;
}
/* 按星期归拢时间段，组内按开始时间排序 */
function sessionsByDay(days, includeAll){
  const map = new Map(days.map(d => [d, []]));
  state.courses.forEach(c => c.sessions.forEach(s => {
    if (!map.has(s.day)) return;
    if (!includeAll && !sessionShown(s)) return;   // 按当前周过滤
    map.get(s.day).push({ course: c, s });
  }));
  map.forEach(a => a.sort((x, y) => x.s.start - y.s.start || x.s.end - y.s.end));
  return map;
}

/* 计算每个时间段的列位置（处理重叠并排） */
function layout(days){
  const items = [];
  state.courses.forEach(c => c.sessions.forEach(s => {
    if (!days.includes(s.day)) return;
    if (!sessionShown(s)) return;                  // 按当前周过滤
    items.push({ course: c, s, day: s.day, start: s.start, end: s.end });
  }));
  const byDay = new Map(days.map(d => [d, []]));
  items.forEach(it => byDay.get(it.day).push(it));
  const out = [];
  byDay.forEach(arr => {
    arr.sort((a, b) => a.start - b.start || a.end - b.end);
    let cluster = [], cEnd = -1;
    const flush = () => {
      if (!cluster.length) return;
      const colEnd = [];
      cluster.forEach(it => {
        let done = false;
        for (let i = 0; i < colEnd.length; i++)
          if (it.start >= colEnd[i]) { it.col = i; colEnd[i] = it.end; done = true; break; }
        if (!done) { it.col = colEnd.length; colEnd.push(it.end); }
      });
      cluster.forEach(it => { it.cols = colEnd.length; out.push(it); });
      cluster = []; cEnd = -1;
    };
    arr.forEach(it => {
      if (cluster.length && it.start >= cEnd) flush();
      cluster.push(it); cEnd = Math.max(cEnd, it.end);
    });
    flush();
  });
  return out;
}

/* ---------- 课程块排版：字号 / 行数自适应 ----------
   窄屏一周铺 5~7 列时，一列只有 60~75px；而课名常是 "PSP002TC-Lecture"
   这类长串。字号必须跟着列宽走 —— 否则只会得到「屏越窄、字越大、
   名字被拦腰截断」的结果。 */
function boardColWidth(n){
  /* 基准取「根元素宽度」，不要用 #scroll.clientWidth / #board.clientWidth：
     这两个在滚动条出现时会少掉滚动条的宽度（桌面测试环境差 10px），
     会让字号被算小一档。往下减掉 #scroll 的左右内边距、#board 的左右边框和时间刻度栏。 */
  const sc = $('#scroll'), board = $('#board'), root = document.documentElement;
  const g = parseFloat(getComputedStyle(root).getPropertyValue('--gutter')) || 58;
  let pad = 0, bd = 0;
  if (sc){ const cs = getComputedStyle(sc); pad = (parseFloat(cs.paddingLeft) || 0) + (parseFloat(cs.paddingRight) || 0); }
  if (board){ const bs = getComputedStyle(board); bd = (parseFloat(bs.borderLeftWidth) || 0) + (parseFloat(bs.borderRightWidth) || 0); }
  const rootW = root.clientWidth || window.innerWidth || 360;
  return Math.max(24, (rootW - pad - bd - g) / Math.max(1, n));
}
/* 文字可用宽度 → 字号：5.6 是「一行约放得下 5~6 个西文字符宽度」的经验值。
   刻意取偏小的字号：宁可两行把课名完整排下，也不要大字号把
   "EAP043 Seminar-D" 挤成 "…Seminar-" + 孤零零一个 "D"。 */
function blkFont(textW){
  return clamp(Math.round(textW / 5.6 * 2) / 2, 9.5, 16);
}
/* 块高 → 该显示哪些行：容量不足时依次牺牲「地点」「时间」，课名永远保留。
   常量与 .blk 的 padding(上下共 8px)、gap(2px)、line-height 对齐。 */
function blkLayout(h, fs, hasLoc){
  const PAD = 8, GAP = 2;
  const t  = fs * 0.86 + GAP;     // 时间行（含间距）
  const m  = fs * 0.86 + GAP;     // 地点行（含间距）
  const nl = fs * 1.22;           // 课名每行
  const budget = Math.max(0, h - PAD);
  const time = budget >= t + nl;                     // 至少装得下「时间 + 1 行课名」
  let loc = false;
  let lp = Math.floor((budget - (time ? t : 0)) / nl);
  if (hasLoc && budget >= t + m + nl * 2){ loc = true; lp = Math.floor((budget - t - m) / nl); }
  return { time, loc, lp: clamp(lp || 1, 1, 6) };
}

function renderBoard(){
  const S = state.settings;
  const days = currentDays();
  const start = S.dayStart * 60, end = S.dayEnd * 60;
  const H = S.hourHeight;
  const bodyH = (end - start) / 60 * H;
  const colW = boardColWidth(days.length);   // 一列的实际可用宽度 → 决定块内字号
  const board = $('#board');
  board.onclick = null;                 // 切回网格时清掉列表视图的事件委托
  const isToday = d => d === todayDow();

  let head = `<div class="board-head"><div class="corner">时间</div><div class="days" style="grid-template-columns:repeat(${days.length},1fr)">` +
    days.map(d => `<div class="${isToday(d) ? 'today' : ''}">${DAY_NAMES[d]}${isToday(d) ? '<small>今天</small>' : ''}</div>`).join('') +
    `</div></div>`;

  let ticks = '';
  for (let m = start; m <= end; m += 60) {
    const y = (m - start) / 60 * H;
    ticks += `<div class="tick" style="top:${y}px">${fmt(m)}</div>`;
  }

  let cols = days.map((d, i) =>
    `<div class="col ${d >= 6 ? 'weekend' : ''}" data-day="${d}" data-idx="${i}" title="点击在此时间新建课程"
      style="left:${i / days.length * 100}%;width:${1 / days.length * 100}%"></div>`).join('');

  const items = layout(days);
  let blocks = items.map(it => {
    const i = days.indexOf(it.day);
    const left = (i + it.col / it.cols) / days.length * 100;
    const w = (1 / it.cols) / days.length * 100;
    const top = (it.start - start) / 60 * H;
    const h = Math.max((it.end - it.start) / 60 * H - 2, 20);
    /* 字号：按「这块自己真正能排字的宽度」算（并排挤窄时自动降档）；
       4px 列间距 + 8px 内边距 + 2px 边框 = 14px 非文字宽度 */
    const textW = colW / it.cols - 14;
    let fs = blkFont(textW);
    if (h < 26) fs = Math.max(9, Math.round(fs * 0.86 * 2) / 2);
    const loc = [it.course.teacher, it.s.location].filter(Boolean).join(' · ');
    const lay = blkLayout(h, fs, !!loc);
    /* 时间行：整段放不下就退成只显示开始时间，再放不下就整行不显示。
       窄列（比如手机铺 7 天）里宁可少一行，也不要让 "11:00–12:50" 被截掉半截。 */
    const smallFs = Math.max(7, fs - 1.5);
    const fitsW = s => s.length * smallFs * 0.6 <= textW;
    const tFull = fmt(it.start) + '–' + fmt(it.end);
    const timeText = !lay.time ? '' : (fitsW(tFull) ? tFull : (fitsW(fmt(it.start)) ? fmt(it.start) : ''));
    const fg = lum(it.course.color) > 0.62 ? '#16202e' : '#ffffff';
    return `<div class="blk" data-cid="${it.course.id}" data-sid="${it.s.id}"
        title="点击编辑：${esc(it.course.name)}（${fmt(it.start)}-${fmt(it.end)}）${loc ? ' · ' + esc(loc) : ''}"
        style="left:${left}%;width:calc(${w}% - 4px);top:${top + 1}px;height:${h}px;--c:${it.course.color};--fg:${fg};--fs:${fs}px;--lp:${lay.lp}">
        ${timeText ? `<div class="bt">${timeText}</div>` : ''}
        <div class="bn">${esc(it.course.name)}</div>
        ${lay.loc ? `<div class="bm">${esc(loc)}</div>` : ''}
      </div>`;
  }).join('');

  let nowHtml = '';
  const nm = nowMin();
  if (days.includes(todayDow()) && nm >= start && nm <= end) {
    nowHtml = `<div class="nowline" style="top:${(nm - start) / 60 * H}px"><span>${fmt(nm)}</span></div>`;
  }

  // 即使没有课程也要渲染网格，否则无法"点击空白格新建课程"
  let hint = state.courses.length ? '' :
    `<div class="emptyhint">还没有课程<br><span>点击任意时间格，即可在该时间新建一节课</span></div>`;
  // 有课但本周都不上（其它周上）→ 明确提示，避免误以为没课了
  const wk = viewWeek();
  let hasAny = 0;
  if (wk != null) sessionsByDay(currentDays(), true).forEach(a => hasAny += a.length);
  if (!hint && wk != null && !items.length && hasAny > 0) {
    hint = `<div class="emptyhint" style="background:transparent;box-shadow:none">
      本周（第 <b>${wk}</b> 周）没有要上的课<br>
      <span>这些课程在其它周有安排，切到对应周即可查看</span></div>`;
  }

  board.innerHTML = head +
    `<div class="board-body">
       <div class="gutter" style="height:${bodyH}px">${ticks}</div>
       <div class="canvas" id="canvas" style="height:${bodyH}px;--h:${H}px">${cols}${blocks}${nowHtml}${hint}</div>
     </div>`;

  board.dataset.colw = colW.toFixed(1);   // 列宽留痕，便于测试与排查
}

/* =====================================================================
   列表视图：以「日」为单位罗列课程，便于增删
   与周/日视图共用同一份 state，任何改动都通过 save() + render() 即时同步
   ===================================================================== */
function renderList(){
  const board = $('#board');
  board.onclick = onListClick;
  const days = listDays();
  const map = sessionsByDay(days);
  const today = todayDow();

  let html = '<div class="dlist">';
  days.forEach(d => {
    const arr = map.get(d);
    const mins = arr.reduce((a, x) => a + (x.s.end - x.s.start), 0);
    const isT = d === today;
    html += `<div class="dgroup${isT ? ' today' : ''}">
      <div class="dhead">
        <span class="dname">${DAY_NAMES[d]}${isT ? '<i>今天</i>' : ''}</span>
        <span class="dcount">${arr.length ? `${arr.length} 节 · ${(mins / 60).toFixed(1)} 课时` : '无课'}</span>
        <button class="dadd" data-day="${d}">＋ 添加</button>
      </div>`;

    if (!arr.length) {
      html += `<div class="dempty">—</div>`;
    } else {
      html += arr.map(({ course: c, s }) => {
        const sub = [c.teacher, s.location].filter(Boolean).join(' · ');
        return `<div class="ditem" data-cid="${c.id}" data-sid="${s.id}" title="点击编辑：${esc(c.name)}">
          <span class="dbar" style="background:${c.color}"></span>
          <div class="dtime"><b>${fmt(s.start)}</b><span>${fmt(s.end)}</span></div>
          <div class="dmain">
            <div class="dtitle">${esc(c.name)}</div>
            <div class="dsub">${sub ? esc(sub) : '—'}</div>
          </div>
          <div class="dacts">
            <button class="dedit" data-cid="${c.id}" data-sid="${s.id}">编辑</button>
            <button class="ddel"  data-cid="${c.id}" data-sid="${s.id}">删除</button>
          </div>
        </div>`;
      }).join('');
    }
    html += '</div>';
  });

  board.innerHTML = html + '</div>';
}

async function onListClick(e){
  // 添加：默认接在该天最后一节课之后（无课则从 08:00 起）
  const add = e.target.closest('.dadd');
  if (add) {
    const day = +add.dataset.day;
    const arr = sessionsByDay(listDays(), true).get(day);
    const hi = state.settings.dayEnd * 60;
    const start = arr.length ? clamp(arr[arr.length - 1].s.end, state.settings.dayStart * 60, hi - 30) : 480;
    openEditor(null, { day, start, end: Math.min(start + 90, hi) });
    return;
  }

  // 删除该时间段（若是课程唯一的时段，则整门课一并移除）
  const del = e.target.closest('.ddel');
  if (del) {
    const ci = state.courses.findIndex(c => c.id === del.dataset.cid);
    if (ci < 0) return;
    const c = state.courses[ci];
    const s = c.sessions.find(x => x.id === del.dataset.sid);
    if (!s) return;
    const last = c.sessions.length === 1;
    const r = await askModal('删除课程时间',
      `确定删除 <b>${esc(c.name)}</b> 的 ${DAY_NAMES[s.day]} ${fmt(s.start)}–${fmt(s.end)}？` +
      (last ? '<br><br>这是该课程<b>唯一</b>的时间段，删除后这门课会一并移除。' : ''),
      [{ label: '取消', value: 'no' }, { label: '删除', value: 'yes', cls: 'danger' }]);
    if (r !== 'yes') return;
    c.sessions = c.sessions.filter(x => x.id !== s.id);
    if (!c.sessions.length) state.courses.splice(ci, 1);
    save(); render();
    toast(last ? `已删除「${c.name}」` : `已删除 ${DAY_NAMES[s.day]} ${fmt(s.start)} 的课程`);
    return;
  }

  const it = e.target.closest('.ditem');
  if (it) openEditor(it.dataset.cid);
}

/* =====================================================================
   交互：纯点击操作（不做任何拖拽）
   - 点课程块   → 编辑该课程
   - 点空白格子 → 在该时间点新建课程（默认 90 分钟）
   ===================================================================== */
document.addEventListener('click', e => {
  const canvas = $('#canvas');
  if (!canvas) return;
  const blk = e.target.closest('.blk');
  if (blk) { openEditor(blk.dataset.cid); return; }
  if (!e.target.classList.contains('col')) return;

  const S = state.settings;
  const r = canvas.getBoundingClientRect();
  const day = +e.target.dataset.day;
  const lo = S.dayStart * 60, hi = S.dayEnd * 60;
  const start = clamp(snapTo(lo + (e.clientY - r.top) / S.hourHeight * 60), lo, hi - 15);
  openEditor(null, { day, start, end: Math.min(start + 90, hi) });
});

document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && !$('#modal').hidden) closeModal();
  if ((e.ctrlKey || e.metaKey) && e.key === 's') { e.preventDefault(); exportJSON(); }
});

/* =====================================================================
   弹窗框架
   ===================================================================== */
function openModal(title, bodyHtml, footHtml){
  $('#mTitle').textContent = title;
  $('#mBody').innerHTML = bodyHtml;
  $('#mFoot').innerHTML = footHtml || '';
  $('#modal').hidden = false;
  $('#mBody').scrollTop = 0;
}
function closeModal(){
  $('#modal').hidden = true; $('#mBody').innerHTML = ''; $('#mFoot').innerHTML = ''; editing = null;
  /* 更新弹窗被关闭（✕ / 点遮罩）：通知一次，用于停止倒计时，避免"关了还在倒计时自动重启" */
  const hook = window._updOnClose;
  if (hook){ window._updOnClose = null; try { hook(); } catch (e) {} }
}
document.addEventListener('click', e => { if (e.target.dataset && 'close' in e.target.dataset) closeModal(); });

/* 通用询问弹窗：buttons = [{label, value, cls}] */
function askModal(title, text, buttons){
  return new Promise(res => {
    openModal(title, `<div class="hint" style="font-size:13.5px;color:var(--text)">${text}</div>`,
      buttons.map((b, i) => `<button class="btn ${b.cls || ''}" data-val="${esc(b.value)}" id="ask${i}">${esc(b.label)}</button>`).join(''));
    $('#mFoot').querySelectorAll('button').forEach(b => b.onclick = () => { closeModal(); res(b.dataset.val); });
  });
}

/* =====================================================================
   课程编辑
   ===================================================================== */
let editing = null; // {course, isNew}

/* 时间段排序：按星期 → 开始时间 → 结束时间 */
function sortSessions(list){
  return list.sort((a, b) => (a.day - b.day) || (a.start - b.start) || (a.end - b.end));
}

function openEditor(cid, prefill){
  const course = cid ? state.courses.find(c => c.id === cid) : null;
  const isNew = !course;
  const base = course ? JSON.parse(JSON.stringify(course)) : {
      id: uid(), name: '', teacher: '', note: '', color: pickColor(),
      sessions: prefill ? [{ id: uid(), day: prefill.day, start: prefill.start, end: prefill.end, location: '', weeks: null }]
                        : [{ id: uid(), day: ui.view === 'day' ? ui.day : (todayDow() <= 5 ? todayDow() : 1),
                             start: 480, end: 570, location: '', weeks: null }]
  };
  base.sessions = sortSessions(base.sessions);   // 打开时先理顺顺序
  editing = { isNew, course: base, colorTouched: false };
  renderEditor();
  $('#modal').hidden = false;
}

/* 为**新建**课程挑初始颜色：优先尚未被占用的调色板颜色（12 门以内保证两两不同） */
function pickColor(){
  const used = state.courses.map(c => c.color);
  return PALETTE.find(c => !used.includes(c)) || PALETTE[state.courses.length % PALETTE.length];
}
/* 按课名给某门课挑颜色：
   1) 同一门课在课表里已有颜色 → 直接沿用（保证同一门课永远同色，不会再变）；
   2) 课名派生色没被别的课占用 → 用派生色（稳定，删课加课都不影响别的课）；
   3) 派生色已被占用 → 取当前用得最少的那个 —— 保证「不同的课」分到不同颜色。 */
function bestColor(name, selfId){
  const n = String(name || '').trim();
  if (!n) return pickColor();
  const others = state.courses.filter(c => c.id !== selfId);
  // 同名课可能不止一节（一门课多个时间段）：沿用它们已有的颜色。
  // 若这几节本身颜色就不一致（历史脏数据），取多数色作为归依色。
  const twins = others.filter(c => String(c.name || '').trim() === n);
  if (twins.length) return majorityColor(twins);
  const want = autoColor(n);
  if (!others.some(c => c.color === want)) return want;
  const cnt = new Map(PALETTE.map(p => [p, 0]));
  others.forEach(c => { if (cnt.has(c.color)) cnt.set(c.color, cnt.get(c.color) + 1); });
  let best = want, bestN = Infinity;
  PALETTE.forEach(p => { const k = cnt.get(p); if (k < bestN){ bestN = k; best = p; } });
  return best;
}
/* ---- 课程配色 ----
   目标：**不同课不同色**（一眼分清哪节是哪门课），同名课同色（同一门课永远一个颜色）。
   做法：先用课名哈希取色——稳定，改课表顺序 / 删课增课都不会让别的课跟着变色；
   若与已占用的颜色撞车，就从哈希位置往后顺延到第一个空位，保证同一屏里不重复。
   历史数据里「导入进来清一色同一个蓝」是最常见的一种：那是可读性杀手，
   和窄屏排版问题一样会让课表变成一坨。colorize() 负责把这种数据一次理顺。 */
function colorize(courses){
  const list = Array.isArray(courses) ? courses : [];
  const names = [];
  list.forEach(c => { if (!names.includes(c.name)) names.push(c.name); });
  names.sort((a, b) => String(a).localeCompare(String(b), 'zh'));   // 排序后分配 → 结果与课程顺序无关
  const used = new Set(), map = new Map();
  names.forEach(n => {
    let col = autoColor(n);
    if (used.has(col)){
      const start = Math.max(0, PALETTE.indexOf(col));
      for (let k = 1; k <= PALETTE.length; k++){
        const cand = PALETTE[(start + k) % PALETTE.length];
        if (!used.has(cand)){ col = cand; break; }
      }
    }
    used.add(col); map.set(n, col);
  });
  let n = 0;
  list.forEach(c => {
    const col = map.get(c.name);
    if (col && c.color !== col){ c.color = col; n++; }
  });
  return n;
}
/* ---- 同一门课 = 同一种颜色 ----
   历史数据里「同名却不同色」最常见的三个来源：复制课程时段、分批多次导入、
   早期版本手动改色只改当次那一节。结果同一门课在课表上花花绿绿，
   看起来像好几门不同的课，扫一眼就是乱的。
   alignSameName() 是精确修补：只把「同名而颜色不一致」的那组拉回同一个颜色，
   完全不碰其它课 —— 比 colorize() 全量重排温和，不会打乱用户已认可的配色。 */
function majorityColor(group){                       // 组内出现最多的颜色；并列取先出现的
  const cnt = new Map();
  group.forEach(c => cnt.set(c.color, (cnt.get(c.color) || 0) + 1));
  let best = group[0].color, bestN = 0;
  cnt.forEach((k, col) => { if (k > bestN){ bestN = k; best = col; } });
  return best;
}
function alignSameName(courses){
  const list = Array.isArray(courses) ? courses : [];
  const groups = new Map();
  list.forEach(c => {
    const key = String(c.name || '').trim();
    if (!key) return;
    if (!groups.has(key)) groups.set(key, []);
    groups.get(key).push(c);
  });
  let n = 0;
  groups.forEach(g => {
    if (g.length < 2) return;
    const col = majorityColor(g);
    g.forEach(c => { if (c.color !== col){ c.color = col; n++; } });
  });
  return n;
}
/* 课表里存在「同名却不同色」吗？（比 isMonochrome 更普遍的一种脏数据） */
function hasSameNameConflict(courses){
  const list = Array.isArray(courses) ? courses : [];
  const m = new Map();
  for (const c of list){
    const key = String(c.name || '').trim();
    if (!key) continue;
    if (m.has(key) && m.get(key) !== c.color) return true;
    m.set(key, c.color);
  }
  return false;
}
/* 保存课程后调用：把这门课的所有时间段统一到一个颜色。
   forceColor 非空（用户刚手动挑过色）→ 以它为准，同名课全部跟随；
   否则按组内多数色收敛。返回改动的条数。 */
function syncCourseColor(course, forceColor){
  const key = String(course && course.name || '').trim();
  if (!key) return 0;
  const group = state.courses.filter(c => String(c.name || '').trim() === key);
  if (group.length < 2) return 0;
  const col = forceColor || majorityColor(group);
  let n = 0;
  group.forEach(c => { if (c.color !== col){ c.color = col; n++; } });
  return n;
}
/* 这份课表是不是「清一色」？≥2 门不同课却只用了 1 种颜色 → 需要自动理顺 */
function isMonochrome(courses){
  const list = Array.isArray(courses) ? courses : [];
  const names = new Set(), cols = new Set();
  list.forEach(c => { names.add(c.name); cols.add(c.color); });
  return names.size >= 2 && cols.size === 1;
}
/* 按课名给**当前课表**重新配色 */
function recolorCourses(){
  const n = colorize(state.courses);
  if (n){ save(); render(); }
  return n;
}
/* 给所有人的课表配色（切到别份课表时同样不会一屏同色） */
function recolorAll(){
  let n = 0;
  (state.people || []).forEach(p => { n += colorize(p.courses); });
  if (n) save();
  return n;
}
/* 启动 / 导入 / 云同步时的配色自愈。两级，顺序不能反：
   ① 同名同色 —— 同一门课的多个时间段统一成一个颜色（精确修补，不动别的课）；
   ② 不同课不同色 —— 整份课表清一色时按课名重排（老备份最常见的缺陷）。
   只做「需要才做」的判断，不做无谓的全量重排，避免用户认可的配色被无端打乱。 */
function autoPaletteFix(){
  if (!state.settings.autoPalette) return 0;
  let n = 0;
  (state.people || []).forEach(p => {
    const list = p.courses || [];
    if (!list.length) return;
    if (hasSameNameConflict(list)) n += alignSameName(list);
    if (isMonochrome(list)) n += colorize(list);
  });
  return n;
}

/* 上下滑动的时间选择列：把分钟整数值渲染成一列竖向可滚选项，返回 html 片段。
   网格以当前值对齐（base = value % step），保证不破坏既有课的整点分钟值。 */
function timeSteps(){
  // 时间选择器范围跟随设置的「时间范围」：dayStart~dayEnd，减少选项、贴近实际课程时段
  const step = Math.max(1, Math.round(state.settings.snap || 5));
  const S = state.settings;
  const lo = clamp(+S.dayStart || 7, 0, 23) * 60;
  const hi = clamp(+S.dayEnd || 24, (+S.dayStart || 7) + 1, 24) * 60;   // 上限 24:00
  return { step, lo, hi };
}
function tmCol(v, role, capLabel){
  const { step, lo, hi } = timeSteps();
  // 生成 lo(含) ~ hi(含) 的格点列表，起点以 lo 对齐步长，终点保证 >= hi 至少含一项
  const times = [];
  for (let t = lo; t <= hi; t += step) times.push(t);
  if (!times.length || times[times.length - 1] < hi) times.push(hi);
  // 当前值 v 吸附到最近的格点（原值多在范围内；偶有越界则贴近边界）
  let idx = 0, bd = Infinity;
  times.forEach((t, i) => {
    const d = Math.abs(t - Math.round(+v || lo));
    if (d < bd) { bd = d; idx = i; }
  });
  const items = times.map((t, i) =>
    `<div class="opt${i === idx ? ' on' : ''}" data-min="${t}" data-i="${i}">${fmt(t)}</div>`).join('');
  const cur = times[idx];
  return `<span class="tmc">
      <span class="tmc-cap">${capLabel}</span>
      <span class="tcol s${role === 'start' ? 'start' : 'end'}" data-role="${role}"
          data-min="${cur}" data-idx="${idx}">
        <div class="cur"></div>
        <div class="opts">${items}</div>
      </span></span>`;
}

function renderEditor(){

    <div class="field"><label>上课时间（可添加多个）</label>
      <div id="fSessions">
        ${c.sessions.map(s => `
          <div class="srow" data-sid="${s.id}">

              <select class="sday">${dayOpts.replace(`value="${s.day}"`, `value="${s.day}" selected`)}</select>

            </div>
            <div class="srow-tm">
              ${tmCol(s.start, 'start', '开始')}
              <span class="to">→</span>
              ${tmCol(s.end, 'end', '结束')}
            </div>
            <div class="srow-wk">
              <span class="wk-lbl">周次</span>
              <select class="spmode">
                <option value="all" ${!s.weeks ? 'selected' : ''}>每周都上</option>

              </select>
              <span class="spgrp${s.weeks ? '' : ' off'}">

                ～ 第<input class="fto" type="number" min="1" max="${W_TOTAL}" value="${s.weeks ? s.weeks.t : W_TOTAL}">周
                <select class="spar" title="周期（同范围内取单/双周）">
                  <option value="0" ${!s.weeks || s.weeks.p === 0 ? 'selected' : ''}>每周</option>
                  <option value="1" ${s.weeks && s.weeks.p === 1 ? 'selected' : ''}>单周</option>
                  <option value="2" ${s.weeks && s.weeks.p === 2 ? 'selected' : ''}>双周</option>
                </select>
              </span>
            </div>
            <input class="loc" placeholder="地点（选填）" value="${esc(s.location)}">
          </div>`).join('')}
      </div>
      <div class="tm-hint">拖动/滚轮把时间滚进中间带即可选中（拖到范围外可快速连续滚动）；点某条时间可跳过去。</div>
      <button class="addlink" id="fAddSession">＋ 添加时间段</button>
    </div>`;

  const foot = (editing.isNew ? '' : `<button class="btn danger" id="fDelete">删除课程</button>`) +
    `<div class="spacer"></div><button class="btn" data-close>取消</button>
     <button class="btn primary" id="fSave">保存</button>`;

  openModal(editing.isNew ? '新增课程' : '编辑课程', body, foot);

  // —— 上下滑动时间选择器：居中当前选中项 + 绑定滚动/点击 ——
  function mark(col, i){
    if (!col) return;
    const opts = col.querySelectorAll('.opt');
    if (!opts.length) return;
    i = Math.max(0, Math.min(i, opts.length - 1));
    col.dataset.min = opts[i].dataset.min;              // 该列此刻选中的分钟
    col.dataset.idx = String(i);
    col.querySelectorAll('.opt').forEach((o, k) => o.classList.toggle('on', k === i));
  }
  function centerTo(col, i){
    if (!col) return;
    const opts = col.querySelectorAll('.opt');
    if (!opts.length) return;
    i = Math.max(0, Math.min(i, opts.length - 1));
    mark(col, i);
    const opt = opts[i];
    col.scrollTop = opt.offsetTop - (col.clientHeight / 2) + (opt.offsetHeight / 2);  // 居中对齐
  }
  // 由当前居中的行判定选中下标
  function idxFromScroll(col){
    const opts = col.querySelectorAll('.opt');
    if (!opts.length) return 0;
    const centerY = col.scrollTop + col.clientHeight / 2;
    let best = 0, bd = Infinity;
    opts.forEach((o, k) => {
      const d = Math.abs((o.offsetTop + o.offsetHeight / 2) - centerY);
      if (d < bd) { bd = d; best = k; }
    });
    return best;
  }
  // 初始化每个列：滚到选中项（延后到布局稳定再定位）
  requestAnimationFrame(() => {
    $('#fSessions').querySelectorAll('.tcol').forEach(col => centerTo(col, +col.dataset.idx || 0));
  });
  // 滚动中只跟随中间高亮（不改 scrollTop 避免与手势打架；scroll-snap 会自然归位）
  let _tick = 0;
  $('#fSessions').addEventListener('scroll', e => {
    const col = e.target.closest ? e.target.closest('.tcol') : null;
    if (!col) return;
    cancelAnimationFrame(_tick);
    _tick = requestAnimationFrame(() => mark(col, idxFromScroll(col)));
  }, true);                                          // capture：scroll 不冒泡
  // 点某一项 → 跳到中间并选中
  let _suppressClick = false;                          // 拖动松开后抑制本次点击
  $('#fSessions').addEventListener('click', e => {
    if (_suppressClick) { _suppressClick = false; return; }
    const o = e.target.closest('.opt'); if (!o) return;
    const col = o.closest('.tcol'); if (!col) return;
    centerTo(col, +o.dataset.i || 0);
  });
  // PC 鼠标按住上下拖拽 → 驱动容器滚动（scroll-snap 在拖动时关闭，避免被“吸”住）
  $('#fSessions').addEventListener('pointerdown', e => {
    if (e.pointerType !== 'mouse' || e.button !== 0) return;  // 触摸走原生滚动，不接管
    const col = e.target.closest('.tcol'); if (!col) return;
    const opts = col.querySelectorAll('.opt'); if (!opts.length) return;
    e.preventDefault();                               // 避免拖出选区/触发 text selection
    const y0 = e.clientY, st = col.scrollTop;
    let dragging = false;
    col.classList.add('dragging');                    // 临时关 scroll-snap
    const move = ev => {
      const dy = ev.clientY - y0;
      if (!dragging) {
        if (Math.abs(dy) < 4) return;                 // 未过阈值视为点击
        dragging = true; _suppressClick = true;
      }
      col.scrollTop = st - dy;                        // 跟手：往下拖→内容向下
    };
    const up = () => {
      col.classList.remove('dragging');
      window.removeEventListener('pointermove', move);
      window.removeEventListener('pointerup', up);
      window.removeEventListener('pointercancel', up);
    };
    window.addEventListener('pointermove', move);
    window.addEventListener('pointerup', up);
    window.addEventListener('pointercancel', up);
  }, true);                                           // capture：.opt/.cur 等都在内部

  /* 新增课程时，课名一填就自动配一个「与他课不同」的颜色；
     用户只要手动点过色板，就不再自动干预（尊重手动选择）。
     标记挂在 editing 上，saveEditor() 保存时要据此判断：
     手动挑色 → 以本次颜色为准，同名课全部跟随；没挑 → 按多数色收敛。 */
  const markSwatch = () => {
    const g = $('#fColors'); if (!g) return;
    g.querySelectorAll('.sw').forEach(b => b.setAttribute('aria-pressed',
      String(String(b.dataset.c || '').toLowerCase() === String(c.color || '').toLowerCase())));
  };
  $('#fColors').onclick = e => {
    const sw = e.target.closest('.sw'); if (!sw) return;
    editing.colorTouched = true;
    c.color = sw.dataset.c;
    markSwatch();
  };
  const fname = $('#fName');
  if (fname) fname.oninput = () => {
    if (editing.colorTouched || !editing.isNew) return;
    const col = bestColor(fname.value, c.id);
    if (col && col !== c.color){ c.color = col; markSwatch(); }
  };
  // 注意：syncFromForm() 会用 DOM 中的行重建 c.sessions，
  // 因此必须先"同步表单 → 再改数据 → 再重绘"，否则改动会被覆盖。
  $('#fAddSession').onclick = () => {
    syncFromForm();                                   // 1. 先把用户改动读进数据
    const last = c.sessions[c.sessions.length - 1];
    const ns = { id: uid(), day: last ? last.day : 1, start: last ? last.start : 480,
                 end: last ? last.end : 570, location: last ? last.location : '', weeks: null };
    c.sessions = sortSessions([...c.sessions, ns]);   // 2. 加进去并立即按日期排序
    renderEditor();                                   // 3. 重绘
    const row = $(`.srow[data-sid="${ns.id}"]`);
    row && row.scrollIntoView({ block: 'nearest' });
  };
  $('#fSessions').onclick = e => {
    const b = e.target.closest('.del'); if (!b) return;
    b.closest('.srow').remove();                      // 1. 先从 DOM 移除该行
    syncFromForm();                                   // 2. 再同步
    if (!c.sessions.length)
      c.sessions.push({ id: uid(), day: todayDow(), start: 480, end: 570, location: '', weeks: null });
    renderEditor();
  };
  // 「每周都上 / 指定周次」切换 → 显隐周次区间输入，无需整页重绘
  $('#fSessions').addEventListener('change', e => {
    const m = e.target.closest('.spmode'); if (!m) return;
    const grp = m.closest('.srow').querySelector('.spgrp');
    if (grp) grp.classList.toggle('off', m.value !== 'spec');
  });
  $('#fSave').onclick = saveEditor;
  const del = $('#fDelete');
  if (del) del.onclick = async () => {
    const r = await askModal('删除课程', `确定删除「${esc(c.name || '未命名课程')}」？该课程的 ${c.sessions.length} 个时间段会一并移除。`,
      [{ label: '取消', value: 'no' }, { label: '删除', value: 'yes', cls: 'danger' }]);
    if (r !== 'yes') return;
    state.courses = state.courses.filter(x => x.id !== c.id);
    save(); render(); closeModal(); toast('已删除');
  };
  setTimeout(() => { const n = $('#fName'); if (n && !c.name) n.focus(); }, 60);
}

function syncFromForm(){
  const c = editing.course;
  c.name = $('#fName').value.trim();
  c.teacher = $('#fTeacher').value.trim();
  c.note = $('#fNote').value.trim();
  // 每次同步都按「星期 → 开始 → 结束」理顺顺序，保证保存与展示顺序一致
  c.sessions = sortSessions([...$('#fSessions').querySelectorAll('.srow')].map(row => {
    // 时间是上下滑动的 .tcol，读 dataset.min（分钟整数）；兜底用旧式 parseT(value)
    const rd = (cls) => {
      const el = row.querySelector(cls);
      if (!el) return null;
      const v = Number(el.dataset.min);
      return Number.isFinite(v) ? v : parseT(el.value);
    };
    let s = rd('.sstart') ?? 480;
    let e = rd('.send') ?? 570;
    if (e < s) { const t = s; s = e; e = t; }
    if (e - s < 5) e = s + 45;
    const tot = clamp(+state.settings.totalWeeks || 20, 1, 30);
    // 周次：spmode=all → null（每周都上）；spmode=spec → 读第 f～t 周 + 周期
    let weeks = null;
    const spmode = row.querySelector('.spmode');
    if (spmode && spmode.value === 'spec') {
      const f = clamp(+row.querySelector('.frm').value || 1, 1, tot);
      let t = clamp(+row.querySelector('.fto').value || tot, 1, tot);
      if (t < f) t = f;
      const p = +row.querySelector('.spar').value || 0;
      weeks = (f === 1 && t === tot && p === 0) ? null : { f, t, p };
    }
    return { id: row.dataset.sid, day: +row.querySelector('.sday').value, start: s, end: e,
             location: row.querySelector('.loc').value.trim(), weeks };
  }));
}

function saveEditor(){
  syncFromForm();
  const c = editing.course;
  if (!c.name) c.name = '未命名课程';
  if (!c.sessions.length) { toast('至少需要一个上课时间'); return; }
  const isNew = editing.isNew;
  if (isNew) state.courses.push(c);
  else { const i = state.courses.findIndex(x => x.id === c.id); if (i >= 0) state.courses[i] = c; }
  /* 同一门课必须同色：入库后把这门课的所有时间段统一到一个颜色。
     刚手动挑过色 → 以本次挑的为准（同名课一起跟着变）；
     没挑过 → 按组内多数色收敛（顺带自愈历史脏数据）。 */
  if (state.settings.autoPalette !== false)
    syncCourseColor(c, editing.colorTouched ? c.color : '');
  save(); render(); closeModal();
  toast(isNew ? '已添加课程' : '已保存修改');
}

    const pendReady = !!(i.version && i.version !== APP_VERSION && updHotReady(i.version));

    if (st){
      let diag = '';
      const pend = (function(){ try { return localStorage.getItem('course-app-pending') || ''; } catch(e){ return ''; } })();
      if (i.lastErr) diag = `上次检查：${i.lastErr}。`;

    const b = $('#sUpdate');
    b.textContent = '检查中…'; b.disabled = true;
    const done = () => { updRefresh(); b.textContent = '检查更新'; b.disabled = false; };

  };
  { /* 一键重启到新版 */
    const ap = $('#sUpdApply');
    if (ap) ap.onclick = () => { closeModal(); updRestart(); };
    const ab = $('#sAutoUpd');

    updRollback();

  const si = $('#sImport');
  if (si) si.onclick = () => { closeModal(); openImport(); };
  const sai = $('#sAiImport');
  if (sai) sai.onclick = () => { closeModal(); openImport('img'); };
  /* AI 整理课表：复制提示词 → 外部 AI 整理 → 结果粘回导入（无需配置接口） */
  const sal = $('#sAiList');
  if (sal) sal.onclick = () => { closeModal(); openAiList(); };
  $('#sClear').onclick = async () => {
    const r = await askModal('清空课程',
      `将删除「<b>${esc(personName())}</b>」的全部课程数据，且无法撤销。建议先导出备份。`,
      [{ label: '取消', value: 'no' }, { label: '确认清空', value: 'yes', cls: 'danger' }]);
