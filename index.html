/* ---------------------------------------------------------------------
   启动同步（本地优先）：解决"每次打开都重复请求、重复处理"的问题
   · 首屏已用本地数据渲染（见文件末尾 state = load(); render()），这里只做后台静默同步
   · 本地无未推送改动、且距上次成功同步不足 CLOUD_FRESH_MS → 直接跳过，不再发请求
   · 否则按 updated_at 条件比对，只有远端真的变新时才应用并重渲染
   · inflight 去重：已有同步在跑就不再并发重复发起
   · 失败静默降级，本地照常用（手动「拉取」不受新鲜度窗口限制）
   --------------------------------------------------------------------- */
const CLOUD_FRESH_MS = 30000;
function cloudBootSync(){
  if (!cloudOn() || cloud.meta.inflight) return;
  const fresh = !cloud.meta.dirty && cloud.meta.lastSync && (Date.now() - cloud.meta.lastSync) < CLOUD_FRESH_MS;
  if (fresh){ cloud.status = 'on'; return; }
  cloud.meta.inflight = true;
  cloudHello().catch(() => {}).then(() => { cloud.meta.inflight = false; });
}

/* ---------------- 拉取 / 推送 ---------------- */
function applyCloudData(data){
  if (!data) return;
  try { localStorage.setItem('course-schedule-localbackup-' + Date.now(), JSON.stringify({ ...state, courses: state.courses })); } catch (e) {}
  const n = normalize({ settings: data.settings || {}, people: data.people || [], activeId: data.activeId });
  state.settings = n.settings;
  state.people   = n.people;
  state.activeId = n.activeId;
  autoPaletteFix();   /* 云端若是老数据（清一色同色），落地即理顺成不同课不同色 */
  save(); render();
}
/* 返回 true 表示本次确实应用了云端新数据（调用方据此感知"有更新"） */
async function cloudPull(){
  const uid = cloudUid(); if (!uid) return false;
  const rows = await cAuto('/rest/v1/schedules?user_id=eq.' + uid + '&select=user_id,data,updated_at');
  const row = rows && rows[0];
  if (row && row.data && Array.isArray(row.data.people) && row.data.people.length){
    /* 关键优化：远端 updated_at 与上次已应用的一致 → 数据没变，
       直接跳过 applyCloudData（省掉 normalize + 落盘 + 重渲染的重活） */
    if (row.updated_at && row.updated_at === cloud.meta.myAt){
      await cloudSyncSubs();
      return false;
    }
    const at = row.updated_at || null;
    _cloudBusy = true;
    applyCloudData(row.data);   /* 应用成功后再推进 myAt，避免应用失败却误标"已同步" */
    _cloudBusy = false;
    cloud.meta.myAt = at;
    await cloudSyncSubs();
    return true;
  }
  await cloudPush();   /* 云端还是空的 → 把本地这份传上去 */
  await cloudSyncSubs();
  return true;
}
async function cloudPush(){
  const uid = cloudUid(); if (!uid) return;
  const stamp = new Date().toISOString();
  const payload = {
    user_id: uid,
    data: {
      version: 2,
      settings: state.settings,
      people: state.people.filter(p => !p.cloud).map(p => ({ id: p.id, name: p.name, courses: p.courses })),
      activeId: state.activeId
    },
    updated_at: stamp
  };
  await cAuto('/rest/v1/schedules?on_conflict=user_id', {
    method: 'POST',
    headers: { Prefer: 'resolution=merge-duplicates,return=minimal' },
    body: JSON.stringify(payload)
  });
  cloud.status = 'on'; cloud.error = '';
  /* 记住本次写入的远端时间点：下次启动时它等于 myAt，就不会把刚推上去的数据又当成"新变化"重新拉取应用 */
  cloud.meta.myAt = stamp; cloud.meta.dirty = false;
  cloudPersist();
}
/* 本地有改动 → 1.5 秒后推一次（合并短时间内的连续修改） */
function cloudSchedulePush(){
  if (!cloudOn() || _cloudBusy) return;
  cloud.meta.dirty = true; cloudPersist();   /* 标记有待推送改动：即使本次没推成功，下次启动也会同步 */
  clearTimeout(_pushT);
  _pushT = setTimeout(() => {
    cloudPush()
      .then(() => { cloud.meta.lastSync = Date.now(); cloudPersist(); })
      .catch(e => { cloud.status = 'error'; cloud.error = String(e.message || e); });
  }, 1500);
}

/* ---------------- 订阅（看同学的课表） ---------------- */
async function cloudSyncSubs(){
  const uid = cloudUid(); if (!uid) return false;
  const subs = await cAuto('/rest/v1/subscriptions?subscriber_id=eq.' + uid + '&select=target_id');
  const ids = (subs || []).map(s => s.target_id).filter(Boolean);
  cloud.subs = ids;
  let profs = [], scheds = [];
  if (ids.length){
    const inq = 'in.(' + ids.join(',') + ')';
    /* 档案与课表互不依赖 → 并行请求，少一个串行来回 */
    const [pp, ss] = await Promise.all([
      cAuto('/rest/v1/profiles?id=' + inq + '&select=id,nickname,share_code'),
      cAuto('/rest/v1/schedules?user_id=' + inq + '&select=user_id,data,updated_at')
    ]);
    profs = pp || []; scheds = ss || [];
  }
  /* 内容签名：订阅列表 + 各目标的昵称/分享码/updated_at。
     签名与上次一致 → 同学课表没有任何变化，直接跳过下面的重建与重渲染 */
  const sigOf = {};
  (profs || []).forEach(p => sigOf[p.id] = p);
  const schedAt = {};
  (scheds || []).forEach(s => schedAt[s.user_id] = s.updated_at || '');
  const sig = JSON.stringify(ids.map(i => [i, (sigOf[i] && sigOf[i].nickname) || '', (sigOf[i] && sigOf[i].share_code) || '', schedAt[i] || '']));
  if (sig === cloud.meta.subsSig) return false;
  cloud.meta.subsSig = sig;

  const pmap = {}; (profs || []).forEach(p => pmap[p.id] = p);
  (scheds || []).forEach(s => {
    const prof = pmap[s.user_id]; if (!prof || !s.data) return;
    const src = (s.data.people || []).filter(p => !p.cloud);
    const courses = src.length ? (src[0].courses || []) : [];
    const pid = 'c_' + s.user_id;
    let p = state.people.find(x => x.id === pid);
    if (!p){ p = { id: pid, name: '', courses: [] }; state.people.push(p); }
    p.name = prof.nickname || '同学';
    p.cloud = { uid: s.user_id, code: prof.share_code };
    /* 把对方开学/周次设置快照带上，让"同学课表"也能按其自己的学期算今天是第几周 */
    const os = (s.data.settings || {});
    p.termStart = os.termStart || null;
    p.totalWeeks = clamp(+os.totalWeeks || 20, 1, 30);
    p.weekFilter = os.weekFilter !== false;
    p.courses = normalize({ courses, settings: { totalWeeks: p.totalWeeks || 20 } }).courses;
  });
  const keep = new Set(ids.map(i => 'c_' + i));
  state.people = state.people.filter(p => !p.cloud || keep.has(p.id));
  if (!state.people.length) state.people = defaults().people;
  if (!state.people.some(p => p.id === state.activeId)) state.activeId = state.people[0].id;
  _cloudBusy = true; save(); render(); _cloudBusy = false;
  cloudPersist();
  return true;
}
async function cloudSubscribe(code){
  const uid = cloudUid(); if (!uid) throw new Error('请先登录');
  code = String(code || '').trim().toUpperCase();
  if (!code) throw new Error('请输入分享码');
  const rows = await cAuto('/rest/v1/profiles?share_code=eq.' + code + '&select=id,nickname,share_code');
  if (!rows || !rows.length) throw new Error('没找到这个分享码，请检查是否输错');
  const t = rows[0];
  if (t.id === uid) throw new Error('这是你自己的分享码');
  await cAuto('/rest/v1/subscriptions?on_conflict=subscriber_id,target_id', {
    method: 'POST',
    headers: { Prefer: 'resolution=merge-duplicates,return=minimal' },
    body: JSON.stringify({ subscriber_id: uid, target_id: t.id })
  });
  await cloudSyncSubs();
  return t;
}
async function cloudUnsubscribe(targetId){
  const uid = cloudUid(); if (!uid) return;
  await cAuto('/rest/v1/subscriptions?subscriber_id=eq.' + uid + '&target_id=eq.' + targetId, { method: 'DELETE' });
  await cloudSyncSubs();
}
function cloudSignOut(){
  cloudGateDone();   /* 主动退出过就不再弹引导了 */
  clearRemembered(); /* 主动退出：忘记账号密码，避免本地残留 */
  cloudSignOutLocal();
  state.people = state.people.filter(p => !p.cloud);
  if (!state.people.some(p => p.id === state.activeId)) state.activeId = state.people[0].id;
  save(); render();
}

/* 把 Supabase 的英文报错翻成人话 */
function cloudErrText(e, mode){
  const m = String((e && e.message) || e || '');
  if (/Invalid login credentials/i.test(m)) return '用户名或密码不对';
  if (/User already registered|already been registered/i.test(m)) return '这个用户名已经被注册了，点「登录」试试';
  if (/Email rate limit|over_email_send_rate_limit/i.test(m)) return '操作太频繁了，等一分钟再试';
  if (/Password should be|weak password|too short/i.test(m)) return '密码太简单了，换一个复杂点的';
  if (/unable to validate email|invalid format|Unable to validate/i.test(m)) return '这个用户名系统不支持，换一个试试';
  if (/Failed to fetch|NetworkError|Network request failed|Load failed/i.test(m)) return '连不上服务器，检查网络后再试';
  return (mode === 'up' ? '注册失败：' : '登录失败：') + m;
}

  }
  /* 未登录：弹窗内两页跳转 —— 先登录页，可「去注册」切到注册页，注册页可「去登录」返回 */

    box.innerHTML = (view === 'up') ? VIEW_UP : VIEW_LOGIN;

    const say = (t, bad) => { if (msg) { msg.textContent = t; msg.style.color = bad ? 'var(--danger,#e5484d)' : ''; } };
    const goIn = $('#authGoIn'), goUp = $('#authGoUp'), backIn = $('#authBackIn');
    if (goUp) goUp.onclick = () => { showAuth('up'); };
    if (backIn) backIn.onclick = () => { showAuth('in'); };
    const showChk = $('#clShowIn') || $('#clShowUp');
    if (showChk) showChk.onchange = () => {
      const t = showChk.checked ? 'text' : 'password';
      ['#clPass', '#clPass2'].forEach(sel => { const el = $(sel); if (el) el.type = t; });
    };
    const mode = (view === 'up') ? 'up' : 'in';
    const btn = $('#clGo' + (view === 'up' ? 'Up' : 'In'));
    const submit = () => {
      const name = String(($('#clName') || {}).value || '').trim();
      const pass = ($('#clPass') || {}).value || '';
      const pass2 = ($('#clPass2') || {}).value || '';
      const isMail = name.indexOf('@') >= 0;      /* 老账号仍可用邮箱登录 */
      if (!name) return say(mode === 'up' ? '请先给自己起个用户名' : '请输入用户名', true);
      if (!isMail){ const bad = nameCheck(name); if (bad) return say(bad, true); }
      if (pass.length < 6) return say('密码至少 6 位', true);
      if (mode === 'up' && pass !== pass2) return say('两次输入的密码不一致', true);
      say('处理中…');
      const email = isMail ? name.toLowerCase() : nameToEmail(name);
      (async () => {
        try {
          if (mode === 'up'){
            /* 用户名唯一性由服务端邮箱保证；若已注册，SignUp 会抛 User already registered，
               由 cloudErrText 翻成人话「已被注册」。无需本地 ilike 预查（匿名读不到别人，查了也白查）。 */
            const r = await cloudSignUp(email, pass);
            if (r === 'confirm'){ say('这个用户名可能已被注册，试试「去登录」', true); return; }
            await cloudSaveNick(name);
          } else {
            await cloudSignIn(email, pass);
            /* 登录成功：勾选"记住"则保存（覆盖旧账号），未勾选则清掉旧凭据 */
            const rm = $('#clRemember');
            if (rm && rm.checked) setRemembered({ name, pass });
            else clearRemembered();
          }
          renderCloud();
        } catch (e){ say(cloudErrText(e, mode), true); }
      })();
    };
    if (btn) btn.onclick = submit;
    ['clName', 'clPass', 'clPass2'].forEach(id => {
      const el = $('#' + id);
      if (el) el.onkeydown = e => { if (e.key === 'Enter'){ e.preventDefault(); submit(); } };
    });
    if (mode === 'up'){ const nm = $('#clName'); if (nm) nm.focus(); }

    /* 记住密码：预填表单 + 首次进入时静默尝试登录 */
    if (mode === 'in') {
      const rm = getRemembered();
      if (rm && rm.name) {
        const ne = $('#clName'), pe = $('#clPass'), ce = $('#clRemember');
        if (ne && !ne.value) ne.value = rm.name;
        if (pe && !pe.value) pe.value = rm.pass || '';
        if (ce) ce.checked = true;
        if (!_autoLoginTried) {
          _autoLoginTried = true;
          /* 静默登录失败时回退到表单（已预填好），不弹错误 */
          setTimeout(async () => {
            try {
              const name = (rm.name || '').trim();
              if (!name) return;
              const email = name.indexOf('@') >= 0 ? name.toLowerCase() : nameToEmail(name);
              await cloudSignIn(email, rm.pass || '');
              renderCloud();
            } catch (e) { /* 静默：不报错，用户看到已预填的表单可手动重登或改密码 */ }
          }, 80);
        }
      }
    }
  };
  showAuth('in');
}

  PALETTE, DAY_NAMES,
  /* 云同步（Supabase）：未配置/未登录时以下方法均无副作用 */
  cloud: {
    open: openCloud, pull: cloudPull, push: cloudPush,
    subscribe: cloudSubscribe, unsubscribe: cloudUnsubscribe,
    signOut: cloudSignOut, status: cloudStatusText,
    get profile(){ return cloud.profile; },
    get on(){ return cloudOn(); }
  },
  get VERSION(){ return 2; }
};

/* 启动时：若上次已登录，静默拉一次云端。失败就当没这回事，本地照常用 */
if (!window.__hotSwapPending){
cloudLoad();
/* 本地优先：首屏已用本地数据渲染完毕，这里只做后台静默同步，并挪到首屏绘制之后——
   冷启动时与渲染抢连接会明显拖慢"打开"的体感（弱网下更明显）。
   新鲜度窗口 + updated_at 条件比对 + 并发去重，共同消除"每次打开都重复请求"。 */
if (cloudOn()) afterPaint(() => cloudBootSync());
else if (cloudGatePending()) openCloudGate();   /* 首次打开引导一次，可跳过 */
}

/* =====================================================================
   应用内更新（打包 App 自检升级）
   ---------------------------------------------------------------------
   APK 内置的网页是打包时的静态副本，不会随 GitHub Pages 自动变新。
   这里在 App 启动时比对线上 version.json，发现新版就下载整份 index.html
   存入 localStorage；下次启动由 head 里的引导脚本整体替换生效。
   · 版本号：部署脚本会从这个常量自动提取并生成线上 version.json，
     所以每次改动代码记得把 APP_VERSION 往上调一档。
   · 回滚：新版若没能正常启动（跑不到本段末尾写 course-app-ok），
     下次启动引导脚本会丢弃缓存、自动回退到内置版本。
   · 网页版（https 打开）不参与自检，打开的永远是最新的线上页面。
   ===================================================================== */
const APP_VERSION = '2026.09.17.20';
const UPD_BASE    = 'https://anbaibai520.github.io/course-schedule/';
const UPD_LS_INFO = 'course-app-upd';
const UPD_LS_OK   = 'course-app-ok';
const UPD_LS_HOT  = 'course-app-hot-html';

function updIsApp(){
  return !!window.Capacitor || location.protocol === 'file:' ||
         location.protocol === 'capacitor:' || location.hostname === 'localhost';
}
function updInfo(){
  try { return JSON.parse(localStorage.getItem(UPD_LS_INFO) || '{}'); } catch(e){ return {}; }
}
function updSaveInfo(o){
  try { localStorage.setItem(UPD_LS_INFO, JSON.stringify(o)); } catch(e){}
}
/* 自动更新偏好：默认开启——发现新版即下载，并在弹窗倒计时后自动重启 */
function updAutoPref(){
  const i = updInfo();
  return i.autoApply === undefined ? true : !!i.autoApply;
}
function updSetAuto(on){
  updSaveInfo(Object.assign({}, updInfo(), { autoApply: !!on }));
}
/* 缓存里是否已经有"就是这个远程版本"的整份页面（有则只需重启，无需再下载） */
function updHotReady(remote){
  if (!remote) return false;
  try {
    const h = localStorage.getItem(UPD_LS_HOT) || '';
    return updInfo().version === remote && h.length >= 20000;
  } catch(e){ return false; }
}
/* 版本号形如 2026.09.17.13：逐段按数值比较，-1 更旧 / 0 相同 / 1 更新。
   用于防止"页面已推新、version.json 还是旧的"时把 App 误降级。 */
function updVerCmp(a, b){
  const pa = String(a || '').split('.'), pb = String(b || '').split('.');
  const n = Math.max(pa.length, pb.length);
  for (let i = 0; i < n; i++){
    const x = parseInt(pa[i], 10) || 0, y = parseInt(pb[i], 10) || 0;
    if (x !== y) return x < y ? -1 : 1;
  }
  return 0;
}

/* ---------- 更新会话状态（单一弹窗，避免同时多个更新流程） ---------- */
const _upd = { remote:'', note:'', phase:'idle', pct:0, count:0, err:'', auto:true, open:false, timer:0, seq:0 };
let _updSnoozed = '';        /* 本次会话内已选择「稍后」的版本，避免反复弹 */
let _updRestarting = false;  /* 重启进行中，防止重复触发 */

/* ---------- 下载新版页面：分块读取，边下边报进度 ---------- */
function updFetchNew(remote, onProgress){
  return fetch(UPD_BASE + 'index.html?t=' + Date.now(), { cache: 'no-store' })
    .then(r => {
      if (!r.ok) throw new Error('下载失败 HTTP ' + r.status);
      const total = +(r.headers.get('content-length') || 0);
      /* 老内核不支持流式读取 → 整体读取，进度直接跳到 100% */
      if (!r.body || typeof r.body.getReader !== 'function'){
        return r.text().then(t => { if (onProgress) onProgress(1); return t; });
      }
      const reader = r.body.getReader();
      const chunks = []; let got = 0;
      const pump = () => reader.read().then(step => {
        if (step.done) return;
        chunks.push(step.value); got += step.value.length;
        /* total 取不到时回调 -1，UI 显示"下载中…"的不确定态 */
        if (onProgress) onProgress(total ? Math.min(0.99, got / total) : -1);
        return pump();
      });
      return pump().then(() => {
        const buf = new Uint8Array(got); let off = 0;
        chunks.forEach(c => { buf.set(c, off); off += c.length; });
        let txt = '';
        try { txt = new TextDecoder('utf-8').decode(buf); } catch(e){ txt = ''; }
        if (!txt){   /* 兜底：无 TextDecoder 时手工解码 */
          let s = '';
          for (let i = 0; i < buf.length; i += 8192) s += String.fromCharCode.apply(null, buf.subarray(i, i + 8192));
          try { txt = decodeURIComponent(escape(s)); } catch(e){ txt = s; }
        }
        if (onProgress) onProgress(1);
        return txt;
      });
    })
    .then(txt => {
      if (!txt || txt.length < 20000) throw new Error('下载内容过短（' + (txt || '').length + ' 字符）');
      if (txt.indexOf('APP_VERSION') < 0) throw new Error('下载内容不是课程表页面');
      localStorage.setItem(UPD_LS_HOT, txt);
      updSaveInfo(Object.assign({}, updInfo(), { version: remote, at: Date.now(), checkedAt: Date.now(), lastErr: '' }));
      return txt;
    });
}

/* ---------- 重启遮罩：避免用户看到"半死"的中间状态 ---------- */
function updOverlay(title, tip){
  let el = document.getElementById('updMask');
  if (!el){
    el = document.createElement('div');
    el.id = 'updMask';
    el.innerHTML = '<div class="upd-card"><div class="upd-spin"></div><b id="updMaskT"></b><small id="updMaskS"></small></div>';
    document.body.appendChild(el);
  }
  const t = document.getElementById('updMaskT'); if (t) t.textContent = title || '';
  const s = document.getElementById('updMaskS'); if (s) s.textContent = tip || '';
}
/* 统一重启入口：reload → replace(href) → Capacitor 原生重启，三重兜底 */
function updRestart(){
  if (_updRestarting) return;
  _updRestarting = true;
  updStopCountdown();
  updOverlay('正在重启…', '新版马上生效');
  let step = 0;
  const go = () => {
    step++;
    try {
      if (step === 1){ location.reload(); return; }
      if (step === 2){ location.replace(location.href); return; }
      const P = window.Capacitor && Capacitor.Plugins;
      if (P && P.App && P.App.restart){ P.App.restart(); return; }
      location.href = location.href;
    } catch(e){}
  };
  go();
  setTimeout(() => { if (_updRestarting) go(); }, 800);
  setTimeout(() => { if (_updRestarting) go(); }, 2000);
  /* 两种方式都失败（极少见）：撤掉遮罩，提示用户手动重开，别把界面锁死 */
  setTimeout(() => {
    if (!_updRestarting) return;
    _updRestarting = false;
    const m = document.getElementById('updMask'); if (m && m.parentNode) m.parentNode.removeChild(m);
    toast('自动重启失败，请手动关闭应用后重新打开');
  }, 4200);
}

/* ---------- 更新弹窗 ---------- */
function updDialogAlive(){ return _upd.open && !$('#modal').hidden; }
function updStopCountdown(){ if (_upd.timer){ clearInterval(_upd.timer); _upd.timer = 0; } }

function updDialogPaint(){
  if (!_upd.open) return;
  const st = document.getElementById('updStatus');
  const btn = document.getElementById('updGo');
  const later = document.getElementById('updLater');
  const bar = document.getElementById('updBar');
  const wrap = document.getElementById('updBarWrap');
  if (!st || !btn) return;
  const pct = _upd.pct < 0 ? -1 : Math.round(_upd.pct * 100);
  if (_upd.phase === 'downloading'){
    st.textContent = pct < 0 ? '正在下载新版本…' : `正在下载新版本… ${pct}%`;
    if (wrap) wrap.style.display = '';
    if (bar) bar.style.width = (pct < 0 ? 32 : Math.max(6, pct)) + '%';
    btn.disabled = true; btn.textContent = '下载中…';
    /* 「稍后」保持可用：用户可以不打断当前操作，已下载的版本下次打开时自动生效 */
    if (later) later.disabled = false;
  } else if (_upd.phase === 'ready'){
    st.textContent = _upd.auto
      ? `新版已就绪，${_upd.count} 秒后自动重启`
      : '新版已就绪，点下方按钮立即重启生效';
    if (wrap) wrap.style.display = '';
    if (bar) bar.style.width = '100%';
    btn.disabled = false; btn.textContent = '立即重启';
    if (later) later.disabled = false;
  } else if (_upd.phase === 'error'){
    st.textContent = '更新失败：' + _upd.err;
    if (wrap) wrap.style.display = 'none';
    btn.disabled = false; btn.textContent = '重试下载';
    if (later) later.disabled = false;
  } else {
    st.textContent = '点击下方按钮下载新版并自动重启，旧数据与设置都会保留。';
    if (wrap) wrap.style.display = 'none';
    btn.disabled = false; btn.textContent = '立即更新并重启';
    if (later) later.disabled = false;
  }
}

/* 关闭弹窗（✕ / 稍后）：停止倒计时，本次会话不再打扰 */
function updSnooze(){
  const r = _upd.remote;
  _upd.open = false; updStopCountdown();
  if (r) _updSnoozed = r;
  window._updOnClose = null;
  if ($('#modal') && !$('#modal').hidden) closeModal();
}
/* 跳过此版本：持久化，自动检查不再提示（手动「检查更新」仍会提示） */
function updSkipVersion(){
  const r = _upd.remote;
  updSaveInfo(Object.assign({}, updInfo(), { skipped: r }));
  updSnooze();
  toast('已跳过 ' + r + '，可在设置里手动更新');
}

function updStartCountdown(){
  _upd.count = 5;
  updStopCountdown();
  updDialogPaint();
  _upd.timer = setInterval(() => {
    if (!updDialogAlive()){ updStopCountdown(); return; }   /* 用户已关弹窗 → 取消自动重启 */
    _upd.count--;
    if (_upd.count <= 0){ updStopCountdown(); updRestart(); return; }
    updDialogPaint();
  }, 1000);
}

/* auto=true 表示自动模式（用户已授权，下载完倒计时后自己重启） */
function updStartDownload(auto){
  if (_upd.phase === 'downloading') return;
  const seq = ++_upd.seq;
  _upd.phase = 'downloading'; _upd.pct = 0; _upd.err = ''; _upd.auto = !!auto;
  updDialogPaint();
  updFetchNew(_upd.remote, p => {
    if (seq !== _upd.seq) return;
    _upd.pct = p; updDialogPaint();
  }).then(() => {
    if (seq !== _upd.seq) return;
    _upd.phase = 'ready'; _upd.pct = 1;
    updDialogPaint();
    if (_upd.auto){ updStartCountdown(); return; }
    /* 手动模式：用户已点过「立即更新并重启」= 同意，稍留一瞬让进度条走满再重启 */
    setTimeout(() => {
      if (seq !== _upd.seq || !updDialogAlive()) return;
      updStopCountdown(); updRestart();
    }, 600);
  }).catch(err => {
    if (seq !== _upd.seq) return;
    _upd.phase = 'error';
    _upd.err = (err && err.message) ? err.message : String(err);
    updSaveInfo(Object.assign({}, updInfo(), { checkedAt: Date.now(), lastErr: _upd.err }));
    updDialogPaint();
  });
}

function updDialogOpen(remote, note){
  _upd.remote = String(remote || '');
  _upd.note = note || '';
  _upd.err = ''; _upd.pct = 0; _upd.open = true; _upd.seq++;
  _upd.auto = updAutoPref();
  _upd.phase = updHotReady(_upd.remote) ? 'ready' : 'idle';

  const body = `
    <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:12px">
      <span class="upd-tag">当前 ${esc(APP_VERSION)}</span>
      <span style="color:var(--muted)">→</span>
      <span class="upd-tag new">新版 ${esc(_upd.remote)}</span>
    </div>
    ${_upd.note ? `<div class="hint" style="font-size:13px;color:var(--text);margin-bottom:10px">更新说明：${esc(_upd.note)}</div>` : ''}
    <div id="updStatus" class="hint" style="font-size:13px;color:var(--text)"></div>
    <div id="updBarWrap" style="display:none;height:6px;border-radius:99px;background:var(--line);overflow:hidden;margin-top:10px">
      <div id="updBar" style="height:100%;width:0;border-radius:99px;background:var(--accent);transition:width .18s"></div>
    </div>
    <div style="display:flex;align-items:center;gap:9px;margin-top:14px;padding-top:12px;border-top:1px solid var(--line2)">
      <button class="switch" id="updAutoBtn" aria-pressed="${_upd.auto}" title="开启后，检测到新版将自动下载并倒计时重启"></button>
      <span class="hint" style="font-size:12.5px">以后自动更新（无需手动确认）</span>
    </div>
    <div class="hint" style="margin-top:10px">
      <span class="upd-link" id="updSkip">跳过此版本，不再提示</span>
    </div>`;
  const foot = `<div class="spacer"></div>
    <button class="btn" id="updLater">稍后</button>
    <button class="btn primary" id="updGo">立即更新并重启</button>`;
  openModal('发现新版本', body, foot);

  $('#updGo').onclick = () => {
    if (_upd.phase === 'ready'){ updStopCountdown(); updRestart(); return; }
    updStartDownload(false);
  };
  $('#updLater').onclick = updSnooze;
  $('#updSkip').onclick  = updSkipVersion;
  const ab = $('#updAutoBtn');
  if (ab) ab.onclick = () => {
    _upd.auto = !_upd.auto;
    ab.setAttribute('aria-pressed', String(_upd.auto));
    updSetAuto(_upd.auto);
    if (_upd.auto){
      if (_upd.phase === 'idle') updStartDownload(true);       /* 刚开启：立刻下载 + 倒计时 */
      else if (_upd.phase === 'ready') updStartCountdown();
    } else {
      updStopCountdown();
      _upd.count = 0;
    }
    updDialogPaint();
  };
  /* 关闭弹窗（点遮罩 / ✕）等同于「稍后」：倒计时必须停掉 */
  window._updOnClose = updSnooze;

  updDialogPaint();
  /* 自动模式：弹窗一出现就开始下载，下完进入倒计时 */
  if (_upd.auto && _upd.phase === 'idle') updStartDownload(true);
}

/* 用户可能正开着课程编辑/设置等弹窗 → 等它关掉再提示更新，避免打断操作。tries≈60 秒 */
function updWhenIdle(fn, tries){
  if (tries === undefined) tries = 40;
  const m = $('#modal');
  if (!m || m.hidden){ fn(); return; }
  if (tries <= 0) return;   /* 一直没空闲就放弃本次提示，下次启动再说 */
  setTimeout(() => updWhenIdle(fn, tries - 1), 1500);
}

/* manual=true 给可见反馈；自动检查静默失败不打扰 */
function updCheck(manual){
  if (!updIsApp()){ if (manual) toast('网页版打开即为最新，无需更新'); return; }
  if (_upd.phase === 'downloading'){ if (manual) toast('正在更新中…'); return; }
  const cur = updInfo();
  return fetch(UPD_BASE + 'version.json?t=' + Date.now(), { cache: 'no-store' })
    .then(r => { if (!r.ok) throw new Error('网络异常 HTTP ' + r.status); return r.json(); })
    .then(m => {
      const remote = String(m.version || '');
      if (!remote) throw new Error('线上版本号为空');
      updSaveInfo(Object.assign({}, cur, { checkedAt: Date.now(), lastOk: remote, lastErr: '' }));
      /* 以"正在运行的版本"为基准比较，而不是上次下载记录，避免重复下载同一版 */
      if (remote === APP_VERSION){ if (manual) toast('已是最新版本 ' + remote); return; }
      if (updVerCmp(remote, APP_VERSION) < 0){
        /* 线上反而更旧（页面推了、清单还没推的中间态）→ 不提示、更不降级 */
        if (manual) toast('线上版本较旧（' + remote + '），无需更新');
        return;
      }
      if (!manual && updInfo().skipped === remote) return;    /* 已跳过该版本 */
      if (!manual && _updSnoozed === remote) return;          /* 本次会话已选稍后 */
      if (!manual){ updWhenIdle(() => updDialogOpen(remote, m.note)); return; }
      updDialogOpen(remote, m.note);                          /* 手动检查：直接接管弹窗 */
    })
    .catch(err => {
      /* 记录真实错误原因，便于在设置里排查（以前只给一句笼统提示） */
      const msg = (err && err.message) ? err.message : String(err);
      updSaveInfo(Object.assign({}, updInfo(), { checkedAt: Date.now(), lastErr: msg }));
      if (manual) toast('检查更新失败：' + msg);
    });
}
/* 丢弃已下载的新版本，回退到 App 内置版本（新版出问题时自救用） */
function updRollback(){
  try {
    localStorage.removeItem(UPD_LS_HOT);
    localStorage.removeItem('course-app-pending');
    const i = updInfo(); delete i.version; delete i.at;
    updSaveInfo(Object.assign({}, i, { lastErr: '' }));
  } catch(e){}
  toast('已清除下载的新版本，重启后回退到内置版');
}
function updAutoCheck(){
  if (!updIsApp()) return;
  setTimeout(function(){ updCheck(false); }, 3500);   /* 让首屏先渲染完，不抢资源 */
}

if (!window.__hotSwapPending){
updAutoCheck();
/* 能跑到这里说明当前版本启动正常，打上标记供引导脚本判断是否需要回滚；
   同时插入 __upd_ok 标记，供更新引导里的“自愈看门狗”确认新版真的跑起来了。
   必须等本页真正完成启动才写 course-app-ok：即将被替换的内置版若抢先写入自己的
   版本号，下一轮启动就会把它判成"新版启动失败"，从而静默丢弃更新。 */
try {
  localStorage.setItem(UPD_LS_OK, APP_VERSION);
  var __updOkEl = document.createElement('span');
  __updOkEl.id = '__upd_ok';
  __updOkEl.style.display = 'none';
  document.body.appendChild(__updOkEl);
} catch(e){}
}
/* 收尾：对应文件开头的 (function(){ ... 见"为什么整段包在一个 IIFE 里" */
}).call(window);
</script>

<!-- 注册 Service Worker：使 PWA 可离线使用、可安装到主屏/桌面。
     App 内（Capacitor 壳）不注册：本地资源本身就是离线可用的，SW 只会多一层
     缓存查找与脚本启动开销，还有 controllerchange 触发整页重载的额外启动风险。
     PWA 能力只对真正的 https 网页端有意义。 -->
<script>
var _swEnable = ('serviceWorker' in navigator) &&
                !(window.Capacitor) &&
                location.protocol.indexOf('http') === 0 &&
                location.hostname !== 'localhost';
if (_swEnable) {
  /* 本次打开前是否已被 SW 接管：首次安装时为 false，用来避免首次访问白刷新一次 */
  var hadSW = !!navigator.serviceWorker.controller;
  window.addEventListener('load', function () {
    navigator.serviceWorker.register('./sw.js').then(function (reg) {
      /* 主动查一次更新，不等浏览器自己的节奏（否则可能隔天才换新版） */
      if (reg && reg.update) { try { reg.update(); } catch (e) {} }
    }).catch(function () {});

    /* 新 SW 接管后刷新一次，让新页面立刻生效；用 sessionStorage 防止同一会话反复刷新 */
    navigator.serviceWorker.addEventListener('controllerchange', function () {
      if (!hadSW) return;
      try {
        if (sessionStorage.getItem('sw-reloaded') === '1') return;
        sessionStorage.setItem('sw-reloaded', '1');
      } catch (e) {}
      location.reload();
    });
  });
}
</script>
</body>
